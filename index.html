sente',c:'#ffffff'}, vazio:{n:'—',c:'#ffffff'}\n};\nconst OPC_RES = ['consultorio','acolhimento','domiciliar','vigilancia','gestao','coletiva','canal','canal_nucleo','aula','reuniao','reun_enf','feedback','tcr','estendido','outro','intervalo','ausente'];\nconst OPC_PREC = ['consultorio','acolhimento','domiciliar','interconsulta','sombra','feedback','revisao','canal_nucleo','canal','reun_prec','reuniao','fb_sup','pi','vigilancia','gestao','coletiva','vacina','estendido','outro','intervalo','ausente'];\nconst SEM_CH = ['ausente','intervalo','vazio'];\n/* Semana padrão recomendada (documento \"Semana padrão dos residentes de Saúde da Família\"). 1 turno = 4h. */\nconst RECOM = [\n  {k:'domiciliar', n:'Atendimento domiciliar', R1:{max:8, t:'até 2 turnos (8h)'}, R2:{min:4, max:4, t:'1 turno (4h)'}},\n  {k:'consultorio', n:'Consultório', R1:{min:10, max:14, t:'aprox. 3 turnos (12h)'}, R2:{min:8, max:8, t:'2 turnos (8h)'}},\n  {k:'vigilancia', n:'Vigilância', R1:{min:3, max:5, t:'aprox. 4h'}, R2:{min:3, max:6, t:'aprox. 4 a 5h'}},\n  {k:'acolhimento', n:'Acolhimento', R1:{min:4, t:'1 turno (4h)'}, R2:{min:4, t:'1 turno (4h)'}},\n  {k:'coletiva', n:'Grupos', R1:{min:2, t:'no mínimo 2h'}, R2:{min:2, t:'no mínimo 2h'}, nota:'Nutrição, psicologia e fisioterapia podem ter carga maior.'},\n  {k:'canal', n:'Canal teórico', R1:{min:2, t:'2h'}, R2:{min:2, t:'2h'}},\n  {k:'canal_nucleo', n:'Canal de núcleo', R1:{min:1, t:'1h'}, R2:{min:1, t:'1h'}},\n  {k:'reuniao', n:'Reunião de equipe', R1:{min:2, t:'2h'}, R2:{min:2, t:'2h'}, nota:'Nutrição, psicologia e fisioterapia podem participar de mais reuniões.'},\n  {k:'gestao', n:'Gestão local', R1:{max:0, t:'não previsto'}, R2:{min:2, t:'no mínimo 2h'}},\n  {k:'tcr', n:'TCR', R1:{max:0, t:'não previsto'}, R2:{min:4, t:'1 turno (4h)'}},\n  {k:'feedback', n:'Feedback', R1:{min:1, t:'1h', obrig:true}, R2:{min:1, t:'1h', obrig:true}},\n  {k:'aula', n:'Aula', R1:{min:4, t:'1 turno (4h)'}, R2:{min:4, t:'1 turno (4h)'}},\n  {k:'reun_enf', n:'Reunião de enfermagem', R1:{min:2, t:'2h'}, R2:{min:2, t:'2h'}, so:'Enfermagem'}\n];\nfunction recomendacoes(p){\n  return RECOM.filter(r=>!r.so || r.so===p.categoria).map(r=>{\n    const g=r[p.ano]||r.R1, h=contar(p,r.k);\n    const ok=(g.min===undefined||h>=g.min)&&(g.max===undefined||h<=g.max);\n    return {n:r.n, t:g.t, h:h, ok:ok, obrig:g.obrig, nota:r.nota};\n  });\n}\n\nconst PARAM_PADRAO = { chResidente:45, chPreceptor:40, chSupervisor:40, aulaMin:4, canalMin:2, reuniaoMin:1, fbResMin:1, estendidoMin:2,\n  fbPorResidente:1, sombraMin:2, revisaoMin:2, canalNucleoMin:1, reunPrecMin:2, fbSupMin:1, piMin:2 };\nconst FERIADOS_PADRAO = [['2026-11-02','Finados'],['2026-11-20','Dia da Consciência Negra'],['2026-12-25','Natal'],['2026-12-08','Imaculada Conceição (confirmar ponto facultativo municipal)']];\nconst CHAVE='escalas-piloto-v1';\n\nconst MES0 = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();\nlet ST = Object.assign({ dados:DADOS, param:Object.assign({},PARAM_PADRAO,CTX.param||{}), feriados:CTX.feriados||[], como:EU.id, aba:null, mes:MES0, pessoaSel:null, diaSel:0, grupoSel:'residente' }, CTX.ui||{});\nST.dados=DADOS; ST.como=EU.id;\nfunction salvar(){ CTX.ui={aba:ST.aba, mes:ST.mes, pessoaSel:ST.pessoaSel, diaSel:ST.diaSel, grupoSel:ST.grupoSel}; }\nconst P = ()=>ST.dados.pessoas;\nconst pessoa = id => P().find(p=>p.id===id);\nconst PSEUDO = {id:EU.id, tipo:'supervisor', nome:EU.nome, curto:EU.nome.split(' ')[0], categoria:'', semGrade:true};\nconst eu = ()=>pessoa(ST.como) || PSEUDO;\nconst PODE_EDITAR_RES = ['supervisor','admin'].indexOf(EU.perfil)>-1;\nconst GESTAO_CAL = ['supervisor','gestor','admin'].indexOf(EU.perfil)>-1;\nconst residentesDe = pid => P().filter(p=>p.tipo==='residente' && p.preceptor===pid);\nfunction persistirGrade(p){\n  PAI.escSalvarGrade(p.id, p.grade).then(r=>{ p.atualizado=r.atualizado; toast('Agenda salva.','ok'); render(); })\n    .catch(e=>{ toast('Não foi possível salvar: '+((e&&e.message)||e),'err'); });\n}\nfunction persistirCalendario(){ PAI.escSalvarCalendario(ST.feriados, ST.dados.eventos).then(()=>toast('Calendário salvo.','ok')).catch(e=>toast('Não foi possível salvar: '+((e&&e.message)||e),'err')); }\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst $ = s=>document.querySelector(s), $$ = s=>Array.from(document.querySelectorAll(s));\nfunction toast(m,t){ const e=document.createElement('div'); e.className='ts '+(t||''); e.textContent=m; $('#toast').appendChild(e); setTimeout(()=>e.remove(),3500); }\n\n/* ---------------- cálculos ---------------- */\nfunction horas(p, filtro){ let n=0; p.grade.forEach(l=>l.forEach(c=>{ if(filtro? filtro(c) : SEM_CH.indexOf(c.a)===-1) n++; })); return n; }\nfunction horasDia(p,d){ return p.grade.reduce((n,l)=>n+(SEM_CH.indexOf(l[d].a)===-1?1:0),0); }\nfunction contar(p,a,alvo){ return horas(p, c=>c.a===a && (!alvo || (c.alvos||[]).indexOf(alvo)>-1)); }\nfunction nomeCel(c){ return c.a==='vazio'?'':(c.d||ATIV[c.a].n); }\n\nfunction validar(p){\n  const A=[], par=ST.param, ok=(t)=>A.push({n:'ok',t}), err=(t)=>A.push({n:'erro',t}), av=(t)=>A.push({n:'aviso',t});\n  const ch=horas(p), meta = p.tipo==='residente'?par.chResidente : p.tipo==='preceptor'?par.chPreceptor:par.chSupervisor;\n  (ch===meta?ok:err)('Carga na grade: '+ch+'h semanais (referência: '+meta+'h)');\n  for(let d=0;d<5;d++){ const h=horasDia(p,d); if(h>6 && !p.grade.some(l=>l[d].a==='intervalo')) err(DIAS[d]+': '+h+'h de jornada sem intervalo registrado'); }\n  if(p.tipo==='residente'){\n    recomendacoes(p).forEach(x=>{ (x.ok?ok:(x.obrig?err:av))(x.n+': '+x.h+'h na agenda (recomendado '+p.ano+': '+x.t+')'); });\n    const ne=contar(p,'estendido'); (ne>=par.estendidoMin?ok:av)('Turno estendido: '+ne+'h (referência '+par.estendidoMin+'h)');\n    // escala de escuta inicial\n    (ST.dados.escuta||[]).filter(e=>e.ids.indexOf(p.id)>-1).forEach(e=>{\n      const c=p.grade[e.slot][e.dia]; (c.a==='acolhimento'?ok:err)('Escuta inicial '+DIAS_C[e.dia]+' '+HORAS[e.slot]+': '+(c.a==='acolhimento'?'confere':'na agenda está “'+nomeCel(c)+'”'));\n    });\n    // cruzamento com o preceptor\n    const pr=pessoa(p.preceptor);\n    if(pr && !p.vacancia){\n      for(let s=0;s<12;s++) for(let d=0;d<5;d++){\n        const c=p.grade[s][d], cp=pr.grade[s][d];\n        const precMarca = cp.a==='feedback' && (cp.alvos||[]).indexOf(p.id)>-1;\n        if(c.a==='feedback' && !precMarca) err('Feedback '+DIAS_C[d]+' '+HORAS[s]+': na agenda do(a) preceptor(a) '+pr.curto+' o horário está como “'+nomeCel(cp)+'”');\n        if(precMarca && c.a!=='feedback') err(pr.curto+' marca feedback com '+p.curto+' '+DIAS_C[d]+' '+HORAS[s]+', mas na agenda do residente está “'+nomeCel(c)+'”');\n        if(cp.a==='sombra' && (cp.alvos||[]).indexOf(p.id)>-1 && ['consultorio','acolhimento','domiciliar','coletiva','vacina'].indexOf(c.a)===-1)\n          av('Sombra '+DIAS_C[d]+' '+HORAS[s]+': residente está em “'+nomeCel(c)+'” (sombra pede atividade assistencial)');\n      }\n    }\n    if(p.vacancia) av('Esta agenda consta na planilha, mas o posto aparece como vacância na lotação 2026.');\n  }\n  if(p.tipo==='preceptor'){\n    residentesDe(p.id).filter(r=>!r.vacancia).forEach(r=>{ const n=contar(p,'feedback',r.id); (n>=par.fbPorResidente?ok:err)('Feedback com '+r.curto+' ('+r.ano+'): '+n+'h (mínimo '+par.fbPorResidente+'h)'); });\n    [['sombra',par.sombraMin,'Sombra'],['revisao',par.revisaoMin,'Revisão de prontuário'],['canal_nucleo',par.canalNucleoMin,'Canal de núcleo'],['reun_prec',par.reunPrecMin,'Reunião de preceptores'],['fb_sup',par.fbSupMin,'Feedback com a supervisão'],['pi',par.piMin,'Preceptoria / projeto de intervenção']]\n      .forEach(x=>{ const n=contar(p,x[0]); (n>=x[1]?ok:av)(x[2]+': '+n+'h (referência '+x[1]+'h)'); });\n    residentesDe(p.id).filter(r=>!r.vacancia).forEach(r=>{\n      for(let s=0;s<12;s++) for(let d=0;d<5;d++){ const cp=p.grade[s][d], c=r.grade[s][d];\n        if(cp.a==='feedback' && (cp.alvos||[]).indexOf(r.id)>-1 && c.a!=='feedback') err('Feedback com '+r.curto+' '+DIAS_C[d]+' '+HORAS[s]+': na agenda do residente está “'+nomeCel(c)+'”');\n        if(c.a==='feedback' && !(cp.a==='feedback' && (cp.alvos||[]).indexOf(r.id)>-1)) err(r.curto+' tem feedback '+DIAS_C[d]+' '+HORAS[s]+', mas na sua agenda está “'+nomeCel(cp)+'”'); }\n    });\n  }\n  return A;\n}\nfunction resumo(p){ const v=validar(p); return {erros:v.filter(x=>x.n==='erro').length, avisos:v.filter(x=>x.n==='aviso').length, v:v}; }\n\n/* ---------------- layout ---------------- */\nfunction abasPara(p){\n  if(p.tipo==='supervisor'){ const a=[['geral','Visão geral'],['onde','Quem está onde'],['agendas',PODE_EDITAR_RES?'Agendas (editar residentes)':'Agendas'],['meu','Meu mês padrão'],['calendario','Calendário do programa'],['param','Parâmetros']]; return p.semGrade? a.filter(x=>x[0]!=='meu') : a; }\n  if(p.tipo==='preceptor') return [['residentes','Agendas dos meus residentes'],['meu','Meu mês padrão'],['calendario','Calendário do programa']];\n  return [['meu','Minha agenda'],['calendario','Calendário do programa']];\n}\nfunction render(){\n  const p=eu(), abas=abasPara(p);\n  if(!abas.some(a=>a[0]===ST.aba)) ST.aba=abas[0][0];\n  $('#tabs').innerHTML = abas.map(a=>'<button class=\"'+(a[0]===ST.aba?'on':'')+'\" onclick=\"irAba(\\''+a[0]+'\\')\">'+a[1]+'<\/button>').join('');\n  const v=$('#view');\n  ({geral:vGeral, onde:vOnde, agendas:vAgendas, meu:vMeu, residentes:vResidentes, calendario:vCalendario, param:vParam})[ST.aba](v,p);\n  salvar();\n}\nfunction irAba(a){ ST.aba=a; render(); window.scrollTo(0,0); }\nfunction mudarComo(id){ ST.como=id; ST.aba=null; ST.pessoaSel=null; render(); }\n\n/* ---------------- grade ---------------- */\nfunction gradeHTML(p, editavel){\n  return '<div class=\"tab-wrap\"><table class=\"grade\"><thead><tr><th><\/th>'+DIAS.map(d=>'<th>'+d+'<br><small>'+'<\/small><\/th>').join('')+'<\/tr><\/thead><tbody>'+\n    HORAS.map((h,s)=>'<tr><th>'+h+'<\/th>'+DIAS.map((d,di)=>{ const c=p.grade[s][di], A=ATIV[c.a]||ATIV.outro;\n      return '<td class=\"cel'+(editavel?' ed':'')+(c.a==='ausente'?' aus':'')+'\" style=\"background:'+A.c+'\"'+(editavel?' onclick=\"editarCel(\\''+p.id+'\\','+s+','+di+')\"':'')+'><b>'+esc(A.n)+'<\/b>'+(c.d && norm(c.d)!==norm(A.n)?'<small>'+esc(c.d)+'<\/small>':'')+'<\/td>'; }).join('')+'<\/tr>').join('')+\n    '<tr class=\"tot\"><th>Horas<\/th>'+DIAS.map((d,di)=>'<td>'+horasDia(p,di)+'h<\/td>').join('')+'<\/tr><\/tbody><\/table><\/div>';\n}\nfunction norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\\s+/g,' ').trim(); }\nfunction checksHTML(p){\n  const v=validar(p), o={erro:'⛔',aviso:'⚠️',ok:'✅'};\n  const e=v.filter(x=>x.n==='erro').length, a=v.filter(x=>x.n==='aviso').length;\n  return '<div class=\"card\"><div class=\"ul\"><b>Conferência automática<\/b><span class=\"chip '+(e?'st-err':a?'st-warn':'st-ok')+'\">'+(e?e+' pendência(s)':a?a+' aviso(s)':'Tudo certo')+'<\/span><\/div>'+\n    '<ul class=\"chk\">'+v.sort((x,y)=>['erro','aviso','ok'].indexOf(x.n)-['erro','aviso','ok'].indexOf(y.n)).map(x=>'<li class=\"'+x.n+'\">'+o[x.n]+' '+esc(x.t)+'<\/li>').join('')+'<\/ul><\/div>';\n}\nfunction recomHTML(p){\n  const L=recomendacoes(p), ok=L.filter(x=>x.ok).length;\n  return '<div class=\"card\"><div class=\"ul\"><b>Semana padrão recomendada · '+esc(p.ano)+'<\/b><span class=\"chip '+(ok===L.length?'st-ok':'st-warn')+'\">'+ok+' de '+L.length+' dentro do recomendado<\/span><\/div>'+\n    '<div class=\"tab-wrap\"><table class=\"lst rec\"><thead><tr><th>Atividade<\/th><th>Recomendado<\/th><th>Na agenda<\/th><th><\/th><\/tr><\/thead><tbody>'+\n    L.map(x=>'<tr class=\"'+(x.ok?'':'fora-rec')+'\"><td>'+esc(x.n)+(x.nota?'<br><small class=\"mut\">'+esc(x.nota)+'<\/small>':'')+'<\/td><td>'+esc(x.t)+'<\/td><td><b>'+x.h+'h<\/b><\/td><td>'+(x.ok?'✅':(x.obrig?'⛔':'⚠️'))+'<\/td><\/tr>').join('')+\n    '<\/tbody><\/table><\/div><p class=\"mut sm\" style=\"margin:6px 0 0\">Referência: “Semana padrão dos residentes de Saúde da Família” (1 turno = 4h). Consultório compartilhado conta como consultório; atividades coletivas contam como grupos.<\/p><\/div>';\n}\nfunction legendaHTML(lista){ return '<div class=\"leg\">'+lista.map(k=>'<span><i style=\"background:'+ATIV[k].c+'\"><\/i>'+ATIV[k].n+'<\/span>').join('')+'<\/div>'; }\nfunction blocoPessoa(p, editavel){\n  const sub=p.tipo==='residente'? p.ano+' · '+p.categoria+' · '+p.equipe+' · Preceptor(a): '+((pessoa(p.preceptor)||{}).curto||'não vinculado(a)') : p.categoria;\n  return '<div class=\"card\"><div class=\"ul\"><div><h2 style=\"margin:0\">'+esc(p.nome)+'<\/h2><p class=\"mut sm\" style=\"margin:2px 0 0\">'+esc(sub)+'<\/p><\/div>'+\n    '<div class=\"bts no-print\">'+(editavel?'<button class=\"btn sm\" onclick=\"restaurarPessoa(\\''+p.id+'\\')\">Desfazer alterações de hoje<\/button>':'')+'<button class=\"btn sm\" onclick=\"window.print()\">Imprimir<\/button><\/div><\/div>'+\n    (p.semCadastro?'<p class=\"aviso-g\">Agenda ainda não cadastrada na plataforma'+(editavel?': toque nos horários para montar.':'.')+'<\/p>':'')+\n    (p.atualizado?'<p class=\"mut sm\" style=\"margin:4px 0\">Última alteração: '+esc(p.atualizado)+'<\/p>':'')+\n    (editavel?'<p class=\"mut sm\">Toque em um horário para alterar a atividade. Cada alteração é salva na hora.<\/p>':'')+gradeHTML(p,editavel)+legendaHTML(p.tipo==='residente'?OPC_RES:OPC_PREC)+'<\/div>'+\n    (p.tipo==='residente'?recomHTML(p):'')+checksHTML(p);\n}\n\n/* ---------------- edição de célula ---------------- */\nfunction editarCel(pid,s,d){\n  const p=pessoa(pid), c=p.grade[s][d], opc=p.tipo==='residente'?OPC_RES:OPC_PREC;\n  const res=p.tipo!=='residente'?residentesDe(p.id):[];\n  abrirModal('<h2>'+esc(p.curto)+' · '+DIAS[d]+' · '+HORAS[s]+'<\/h2>'+\n    '<div class=\"chips\" id=\"mA\">'+opc.map(k=>'<button type=\"button\" class=\"chip-bt'+(k===c.a?' on':'')+'\" data-k=\"'+k+'\" style=\"border-left:6px solid '+ATIV[k].c+'\">'+ATIV[k].n+'<\/button>').join('')+'<\/div>'+\n    '<div class=\"fld\"><label class=\"lbl\" for=\"mD\">Detalhe (opcional)<\/label><input type=\"text\" id=\"mD\" value=\"'+esc(c.d&&norm(c.d)!==norm(ATIV[c.a].n)?c.d:'')+'\" placeholder=\"Ex.: compartilhado com R2 Nutrição; Grupo Viva Movimento\"><\/div>'+\n    (res.length?'<div class=\"fld\" id=\"mAlvW\"><span class=\"lbl\">Residente(s) envolvido(s) — para feedback e sombra<\/span><div class=\"chips\">'+res.map(r=>'<label class=\"chip\"><input type=\"checkbox\" name=\"mAlv\" value=\"'+r.id+'\"'+((c.alvos||[]).indexOf(r.id)>-1?' checked':'')+'><span>'+esc(r.curto)+' ('+r.ano+')<\/span><\/label>').join('')+'<\/div><\/div>':'')+\n    '<div class=\"fld\"><label class=\"lbl\" for=\"mN\">Repetir nos próximos horários do mesmo dia<\/label><select id=\"mN\">'+[0,1,2,3,4,5].map(n=>'<option value=\"'+n+'\">'+(n?n+' horário(s)':'Não repetir')+'<\/option>').join('')+'<\/select><\/div>'+\n    '<div class=\"fld\"><span class=\"lbl\">Aplicar também em<\/span><div class=\"chips\">'+DIAS.map((x,i)=>i===d?'':'<label class=\"chip\"><input type=\"checkbox\" name=\"mDias\" value=\"'+i+'\"><span>'+DIAS_C[i]+'<\/span><\/label>').join('')+'<\/div><\/div>'+\n    '<div class=\"m-acoes\"><button class=\"btn\" onclick=\"fecharModal()\">Cancelar<\/button><button class=\"btn pri\" id=\"mOk\">Salvar<\/button><\/div>');\n  let sel=c.a;\n  $$('#mA .chip-bt').forEach(b=>b.onclick=()=>{ if(b.dataset.k!==sel) $('#mD').value=''; sel=b.dataset.k; $$('#mA .chip-bt').forEach(x=>x.classList.toggle('on',x===b)); });\n  $('#mOk').onclick=()=>{\n    const det=$('#mD').value.trim(), alv=$$('[name=\"mAlv\"]:checked').map(x=>x.value), rep=Number($('#mN').value), dias=[d].concat($$('[name=\"mDias\"]:checked').map(x=>Number(x.value)));\n    dias.forEach(dd=>{ for(let k=0;k<=rep && s+k<12;k++){ const nc={a:sel, d:det||ATIV[sel].n}; if(alv.length && ['feedback','sombra','pi'].indexOf(sel)>-1) nc.alvos=alv; p.grade[s+k][dd]=nc; } });\n    p.semCadastro=false; fecharModal(); render(); persistirGrade(p);\n  };\n}\nfunction restaurarPessoa(pid){ const o=ORIGINAL.pessoas.find(x=>x.id===pid); if(!o) return; const p=pessoa(pid); p.grade=JSON.parse(JSON.stringify(o.grade)); render(); persistirGrade(p); }\nfunction abrirModal(h){ $('#modal-box').innerHTML=h; $('#modal').classList.remove('hidden'); }\nfunction fecharModal(){ $('#modal').classList.add('hidden'); }\n\n/* ---------------- telas ---------------- */\nfunction vGeral(v){\n  const rs=P().filter(p=>p.tipo==='residente'), ps=P().filter(p=>p.tipo==='preceptor');\n  const linha=p=>{ const r=resumo(p); return '<tr onclick=\"verPessoa(\\''+p.id+'\\')\" class=\"click\"><td><b>'+esc(p.curto)+'<\/b><br><small class=\"mut\">'+esc(p.tipo==='residente'?p.ano+' '+p.categoria+' · '+p.equipe:p.categoria)+'<\/small><\/td><td>'+horas(p)+'h<\/td><td>'+(r.erros?'<span class=\"chip st-err\">'+r.erros+'<\/span>':'—')+'<\/td><td>'+(r.avisos?'<span class=\"chip st-warn\">'+r.avisos+'<\/span>':'—')+'<\/td><\/tr>'; };\n  const tot=P().filter(p=>p.tipo!=='supervisor').reduce((a,p)=>{ const r=resumo(p); a.e+=r.erros; a.a+=r.avisos; return a; },{e:0,a:0});\n  const cruz=[]; ps.forEach(p=>validar(p).filter(x=>x.n==='erro' && /feedback/i.test(x.t)).forEach(x=>cruz.push(p.curto+': '+x.t)));\n  rs.forEach(p=>validar(p).filter(x=>x.n==='erro' && /Escuta inicial/.test(x.t)).forEach(x=>cruz.push(p.curto+': '+x.t)));\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Visão geral das escalas<\/h1><p class=\"mut sm\">'+esc(CTX.unidade)+' · conferência automática das agendas de residentes e do mês padrão dos preceptores.<\/p><\/div><\/div>'+\n    '<div class=\"grid g4\"><div class=\"kpi\"><span>Residentes<\/span><b>'+rs.length+'<\/b><\/div><div class=\"kpi\"><span>Preceptores<\/span><b>'+ps.length+'<\/b><\/div><div class=\"kpi\"><span>Pendências<\/span><b style=\"color:var(--err)\">'+tot.e+'<\/b><\/div><div class=\"kpi\"><span>Avisos<\/span><b style=\"color:var(--warn)\">'+tot.a+'<\/b><\/div><\/div>'+\n    (cruz.length?'<div class=\"card\" style=\"margin-top:12px;border-color:#f0c4c0\"><b>Cruzamentos que precisam de ajuste<\/b><ul class=\"chk\">'+cruz.map(t=>'<li class=\"erro\">⛔ '+esc(t)+'<\/li>').join('')+'<\/ul><\/div>':'')+\n    '<h3 class=\"sec-t\">Residentes<\/h3><div class=\"card\" style=\"padding:0\"><table class=\"lst\"><thead><tr><th>Residente<\/th><th>Carga<\/th><th>Pend.<\/th><th>Avisos<\/th><\/tr><\/thead><tbody>'+rs.map(linha).join('')+'<\/tbody><\/table><\/div>'+\n    '<h3 class=\"sec-t\">Preceptores (mês padrão)<\/h3><div class=\"card\" style=\"padding:0\"><table class=\"lst\"><thead><tr><th>Preceptor(a)<\/th><th>Carga<\/th><th>Pend.<\/th><th>Avisos<\/th><\/tr><\/thead><tbody>'+ps.map(linha).join('')+'<\/tbody><\/table><\/div>'+\n    '<p class=\"mut sm\">Toque em uma pessoa para ver a agenda e o detalhamento.<\/p>';\n}\nfunction verPessoa(id){ ST.pessoaSel=id; ST.aba='agendas'; render(); window.scrollTo(0,0); }\nfunction vAgendas(v){\n  const lista=P().filter(p=>p.tipo!=='supervisor'); if(!lista.length){ v.innerHTML='<div class=\"card vazio\">Nenhum residente ou preceptor cadastrado nesta unidade.<\/div>'; return; } if(!ST.pessoaSel || !pessoa(ST.pessoaSel) || pessoa(ST.pessoaSel).tipo==='supervisor') ST.pessoaSel=lista[0].id;\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Agendas<\/h1><p class=\"mut sm\">'+(PODE_EDITAR_RES?'A supervisão pode editar a agenda dos residentes (assim como o preceptor). ':'Consulta das agendas. ')+'O mês padrão dos preceptores é editado pelo próprio preceptor e aparece aqui apenas para consulta.<\/p><\/div><\/div>'+\n    '<div class=\"filtros\"><label>Pessoa<select id=\"selP\" onchange=\"ST.pessoaSel=this.value;render()\">'+['residente','preceptor'].map(t=>'<optgroup label=\"'+(t==='residente'?'Residentes':'Preceptores')+'\">'+lista.filter(x=>x.tipo===t).map(x=>'<option value=\"'+x.id+'\"'+(x.id===ST.pessoaSel?' selected':'')+'>'+esc(x.curto)+'<\/option>').join('')+'<\/optgroup>').join('')+'<\/select><\/label><\/div>'+\n    blocoPessoa(pessoa(ST.pessoaSel), PODE_EDITAR_RES && pessoa(ST.pessoaSel).tipo==='residente')+mesHTML(pessoa(ST.pessoaSel));\n}\nfunction vResidentes(v,p){\n  const rs=residentesDe(p.id); if(!rs.length){ v.innerHTML='<div class=\"card vazio\">Nenhum residente vinculado.<\/div>'; return; }\n  if(!ST.pessoaSel || rs.every(r=>r.id!==ST.pessoaSel)) ST.pessoaSel=rs[0].id;\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Agendas dos meus residentes<\/h1><p class=\"mut sm\">Você monta a agenda semanal de cada residente. A conferência mostra carga, atividades obrigatórias e se o feedback bate com o seu mês padrão.<\/p><\/div><\/div>'+\n    '<div class=\"chips\" style=\"margin-bottom:12px\">'+rs.map(r=>{ const z=resumo(r); return '<button class=\"chip-bt'+(r.id===ST.pessoaSel?' on':'')+'\" onclick=\"ST.pessoaSel=\\''+r.id+'\\';render()\">'+esc(r.curto)+' ('+r.ano+')'+(z.erros?' ⛔'+z.erros:'')+'<\/button>'; }).join('')+'<\/div>'+\n    blocoPessoa(pessoa(ST.pessoaSel), true);\n}\nfunction vMeu(v,p){\n  const edit=p.tipo!=='residente';\n  v.innerHTML='<div class=\"pg-head\"><div><h1>'+(p.tipo==='residente'?'Minha agenda':'Meu mês padrão')+'<\/h1><p class=\"mut sm\">'+(p.tipo==='residente'?'Agenda semanal definida pelo(a) seu(sua) preceptor(a) e o mês com feriados e atividades do programa.':'Monte a semana padrão; o mês é gerado automaticamente com feriados e atividades do programa.')+'<\/p><\/div><\/div>'+\n    blocoPessoa(p, edit)+mesHTML(p);\n}\nfunction vOnde(v){\n  const d=ST.diaSel||0, g=ST.grupoSel||'residente', ps=P().filter(p=>g==='todos'?p.tipo!=='supervisor':p.tipo===g);\n  const abrev=c=>({consultorio:'Cons',acolhimento:'Acol',domiciliar:'AD',vigilancia:'Vig',gestao:'Gest',coletiva:'Grupo',canal:'Canal',canal_nucleo:'Núcleo',aula:'Aula',reuniao:'Reun',feedback:'FB',tcr:'TCR',estendido:'Est',sombra:'Sombra',interconsulta:'Inter',reun_prec:'R.Prec',pi:'PI',revisao:'Rev',fb_sup:'FB Sup',vacina:'Vac',outro:'Outro',intervalo:'Int',ausente:'',vazio:''}[c.a]);\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Quem está onde<\/h1><p class=\"mut sm\">Distribuição da equipe por horário. A linha de cobertura mostra quantas pessoas estão no acolhimento.<\/p><\/div><\/div>'+\n    '<div class=\"filtros\"><label>Dia<select onchange=\"ST.diaSel=Number(this.value);render()\">'+DIAS.map((x,i)=>'<option value=\"'+i+'\"'+(i===d?' selected':'')+'>'+x+'<\/option>').join('')+'<\/select><\/label>'+\n    '<label>Grupo<select onchange=\"ST.grupoSel=this.value;render()\">'+[['residente','Residentes'],['preceptor','Preceptores'],['todos','Todos']].map(x=>'<option value=\"'+x[0]+'\"'+(x[0]===g?' selected':'')+'>'+x[1]+'<\/option>').join('')+'<\/select><\/label><\/div>'+\n    '<div class=\"card\" style=\"padding:8px\"><div class=\"tab-wrap\"><table class=\"onde\"><thead><tr><th><\/th>'+ps.map(p=>'<th title=\"'+esc(p.nome)+'\">'+esc(p.curto.split(' ')[0])+'<\/th>').join('')+'<th>Acolh.<\/th><\/tr><\/thead><tbody>'+\n    HORAS.map((h,s)=>{ const n=ps.filter(p=>p.grade[s][d].a==='acolhimento').length; return '<tr><th>'+h+'<\/th>'+ps.map(p=>{ const c=p.grade[s][d]; return '<td style=\"background:'+ATIV[c.a].c+'\" title=\"'+esc(nomeCel(c))+'\">'+abrev(c)+'<\/td>'; }).join('')+'<td class=\"cob'+(n===0&&s<10?' zero':'')+'\">'+n+'<\/td><\/tr>'; }).join('')+\n    '<\/tbody><\/table><\/div><\/div>'+legendaHTML(['consultorio','acolhimento','domiciliar','vigilancia','gestao','coletiva','canal','canal_nucleo','aula','reuniao','feedback','tcr','estendido','sombra','interconsulta','pi','revisao','intervalo']);\n}\nfunction vCalendario(v,p){\n  const sup=GESTAO_CAL, mes=ST.mes;\n  const evs=ST.dados.eventos.filter(e=>e.data.slice(0,7)===mes).sort((a,b)=>a.data.localeCompare(b.data));\n  const fer=ST.feriados.filter(f=>f.data.slice(0,7)===mes);\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Calendário do programa<\/h1><p class=\"mut sm\">Atividades lançadas uma vez pela supervisão e aplicadas automaticamente nas agendas do mês.<\/p><\/div><\/div>'+\n    '<div class=\"filtros\"><label>Mês<input type=\"month\" value=\"'+mes+'\" onchange=\"ST.mes=this.value||ST.mes;render()\"><\/label><\/div>'+\n    '<div class=\"card\"><b>Feriados e pontos facultativos<\/b><ul class=\"chk\">'+(fer.length?fer.map(f=>'<li>📅 '+dataBr(f.data)+' — '+esc(f.nome)+(sup?' <button class=\"x\" onclick=\"remFer(\\''+f.data+'\\')\">×<\/button>':'')+'<\/li>').join(''):'<li class=\"mut\">Nenhum feriado cadastrado neste mês.<\/li>')+'<\/ul>'+\n    (sup?'<div class=\"row3\"><input type=\"date\" id=\"fD\"><input type=\"text\" id=\"fN\" placeholder=\"Descrição\"><button class=\"btn sm\" onclick=\"addFer()\">Adicionar<\/button><\/div>':'')+'<\/div>'+\n    '<div class=\"card\"><b>Atividades do programa<\/b><ul class=\"chk\">'+(evs.length?evs.map((e,i)=>'<li>🗓️ <b>'+dataBr(e.data)+'<\/b> · '+esc(e.tipo)+': '+esc(e.titulo)+(e.resp?' <span class=\"mut\">('+esc(e.resp)+')<\/span>':'')+(sup?' <button class=\"x\" onclick=\"remEv(\\''+e.data+'\\',\\''+esc(e.titulo).replace(/'/g,'')+'\\')\">×<\/button>':'')+'<\/li>').join(''):'<li class=\"mut\">Nenhuma atividade no mês.<\/li>')+'<\/ul>'+\n    (sup?'<div class=\"row3\"><input type=\"date\" id=\"eD\"><select id=\"eT\"><option>Canal teórico<\/option><option>Reunião de preceptores<\/option><option>Atividade intersetorial<\/option><option>Aula / EP<\/option><option>Outro<\/option><\/select><input type=\"text\" id=\"eN\" placeholder=\"Tema / atividade\"><button class=\"btn sm\" onclick=\"addEv()\">Adicionar<\/button><\/div>':'')+'<\/div>';\n}\nfunction addFer(){ const d=$('#fD').value, n=$('#fN').value.trim(); if(!d||!n) return toast('Informe data e descrição.','err'); ST.feriados.push({data:d,nome:n}); CTX.feriados=ST.feriados; render(); persistirCalendario(); }\nfunction remFer(d){ ST.feriados=ST.feriados.filter(f=>f.data!==d); CTX.feriados=ST.feriados; render(); persistirCalendario(); }\nfunction addEv(){ const d=$('#eD').value, t=$('#eT').value, n=$('#eN').value.trim(); if(!d||!n) return toast('Informe data e tema.','err'); ST.dados.eventos.push({data:d,tipo:t,titulo:n,resp:''}); render(); persistirCalendario(); }\nfunction remEv(d,t){ ST.dados.eventos=ST.dados.eventos.filter(e=>!(e.data===d && esc(e.titulo).replace(/'/g,'')===t)); render(); persistirCalendario(); }\nfunction vParam(v){\n  const L=[['chResidente','Carga semanal na grade — residente (h)'],['chPreceptor','Carga semanal — preceptor (h)'],['chSupervisor','Carga semanal — supervisor (h)'],['estendidoMin','Residente: turno estendido (h)'],['fbPorResidente','Preceptor: feedback por residente (h)'],['sombraMin','Preceptor: sombra (h)'],['revisaoMin','Preceptor: revisão de prontuário (h)'],['canalNucleoMin','Preceptor: canal de núcleo (h)'],['reunPrecMin','Preceptor: reunião de preceptores (h)'],['fbSupMin','Preceptor: feedback com a supervisão (h)'],['piMin','Preceptor: preceptoria / projeto de intervenção (h)']];\n  v.innerHTML='<div class=\"pg-head\"><div><h1>Parâmetros da conferência<\/h1><p class=\"mut sm\">Valores de referência usados nas verificações. Os mínimos do preceptor seguem o modelo do mês padrão do PRMFC e podem ser ajustados para a residência multiprofissional.<\/p><\/div><\/div>'+\n    '<div class=\"card\">'+L.map(x=>'<div class=\"prm\"><label for=\"pp_'+x[0]+'\">'+x[1]+'<\/label><input type=\"number\" min=\"0\" max=\"60\" id=\"pp_'+x[0]+'\" value=\"'+ST.param[x[0]]+'\"><\/div>').join('')+\n    '<div class=\"m-acoes\"><button class=\"btn\" onclick=\"ST.param=Object.assign({},PARAM_PADRAO);render();salvarParam()\">Restaurar padrão<\/button><button class=\"btn pri\" onclick=\"salvarParam()\">Salvar<\/button><\/div><\/div>'+\n    '<div class=\"card\"><b>Semana padrão recomendada dos residentes<\/b><div class=\"tab-wrap\"><table class=\"lst rec\"><thead><tr><th>Atividade<\/th><th>R1<\/th><th>R2<\/th><\/tr><\/thead><tbody>'+\n      RECOM.map(r=>'<tr><td>'+esc(r.n)+(r.so?' <small class=\"mut\">('+r.so+')<\/small>':'')+'<\/td><td>'+esc(r.R1.t)+'<\/td><td>'+esc(r.R2.t)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><\/div>'+\n''+'';\n}\nfunction salvarParam(){ Object.keys(PARAM_PADRAO).forEach(k=>{ const el=$('#pp_'+k); if(el) ST.param[k]=Number(el.value)||0; }); CTX.param=ST.param; render();\n  if(!GESTAO_CAL) return; PAI.escSalvarParam(ST.param).then(()=>toast('Parâmetros salvos.','ok')).catch(e=>toast('Não foi possível salvar: '+((e&&e.message)||e),'err')); }\n\n/* ---------------- mês ---------------- */\nfunction dataBr(iso){ const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }\nfunction semanasDoMes(ym){\n  const [y,m]=ym.split('-').map(Number), ini=new Date(y,m-1,1), fim=new Date(y,m,0);\n  const seg=new Date(ini); seg.setDate(ini.getDate()-((ini.getDay()+6)%7));\n  const sem=[]; for(let d=new Date(seg); d<=fim; d.setDate(d.getDate()+7)){ const w=[]; for(let i=0;i<5;i++){ const x=new Date(d); x.setDate(d.getDate()+i); w.push(x); } sem.push(w); }\n  return sem;\n}\nconst iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nfunction mesHTML(p){\n  const ym=ST.mes, [y,m]=ym.split('-').map(Number);\n  const nomesMes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\n  const evs=ST.dados.eventos.filter(e=>e.data.slice(0,7)===ym);\n  let total=0;\n  const semanas=semanasDoMes(ym).map(w=>{\n    return '<table class=\"grade mes\"><thead><tr><th><\/th>'+w.map((d,i)=>{ const f=ST.feriados.find(x=>x.data===iso(d)); const fora=d.getMonth()!==m-1;\n      return '<th class=\"'+(fora?'fora':'')+(f?' fer':'')+'\">'+String(d.getDate()).padStart(2,'0')+' · '+DIAS_C[i]+(f?'<br><small>'+esc(f.nome)+'<\/small>':'')+'<\/th>'; }).join('')+'<\/tr><\/thead><tbody>'+\n      HORAS.map((h,s)=>'<tr><th>'+h+'<\/th>'+w.map((d,i)=>{\n        const fora=d.getMonth()!==m-1, f=ST.feriados.find(x=>x.data===iso(d));\n        if(fora) return '<td class=\"fora\"><\/td>';\n        if(f) return '<td class=\"fer\">Feriado<\/td>';\n        const c=p.grade[s][i], A=ATIV[c.a]||ATIV.outro; if(SEM_CH.indexOf(c.a)===-1) total++;\n        const ev=evs.find(e=>e.data===iso(d) && ((e.tipo==='Canal teórico' && c.a==='canal') || (e.tipo==='Reunião de preceptores' && c.a==='reun_prec')));\n        return '<td style=\"background:'+A.c+'\"'+(c.a==='ausente'?' class=\"aus\"':'')+'><b>'+esc(A.n)+'<\/b>'+(ev?'<small class=\"ev\">'+esc(ev.titulo)+'<\/small>':'')+'<\/td>';\n      }).join('')+'<\/tr>').join('')+'<\/tbody><\/table>';\n  }).join('');\n  const lista=evs.sort((a,b)=>a.data.localeCompare(b.data)).map(e=>'<li><b>'+dataBr(e.data).slice(0,5)+'<\/b> · '+esc(e.tipo)+': '+esc(e.titulo)+'<\/li>').join('');\n  return '<div class=\"card mes-card\"><div class=\"ul\"><div><h2 style=\"margin:0\">Mês: '+nomesMes[m-1]+' de '+y+'<\/h2><p class=\"mut sm\" style=\"margin:2px 0 0\">'+esc(p.nome)+' · '+total+'h no mês (dias úteis, descontados feriados)<\/p><\/div>'+\n    '<div class=\"bts no-print\"><input type=\"month\" value=\"'+ym+'\" onchange=\"ST.mes=this.value||ST.mes;render()\"><button class=\"btn sm\" onclick=\"window.print()\">Imprimir mês<\/button><\/div><\/div>'+\n    '<div class=\"tab-wrap\">'+semanas+'<\/div>'+(lista?'<div class=\"obs\"><b>Atividades do programa no mês<\/b><ul>'+lista+'<\/ul><\/div>':'')+\n    '<div class=\"obs\"><b>Observações<\/b><ul><li>As atividades devem respeitar a carga horária regulamentar; horas extras só com autorização prévia da direção.<\/li><li>Intervalo mínimo de 1h em jornadas diárias acima de 6h.<\/li><li>Dúvidas na elaboração das escalas: acione a supervisão de preceptoria.<\/li><\/ul><\/div><\/div>';\n}\n\nwindow.addEventListener('load',()=>{ render(); if(PAI.escPronto) PAI.escPronto(window); });\n<\/script>\n<\/body><\/html>\n";
</script>
