    {grupo:"Etapa 9 · Acompanhar", titulo:"Monitoramento e avaliação", guia:"<p>São processos diferentes, em momentos distintos do projeto.</p>\n<div class=\"mini\">\n<div><b>Monitoramento · durante</b>Foco no processo: as metas do cronograma estão sendo cumpridas? Os recursos bastam? A equipe está engajada? O público comparece? Ferramentas: reuniões, listas de presença, planilhas de controle, relatórios parciais.</div>\n<div><b>Avaliação · depois</b>Foco no resultado: o problema foi reduzido? O objetivo geral foi alcançado? O que funcionou e o que falhou? Ferramentas: comparação antes e depois, questionários de satisfação, análise de indicadores.</div>\n</div>\n<h4>Tipos de indicador</h4>\n<ul>\n<li><b>Estrutura:</b> recursos e preparação. Ex.: nº de profissionais treinados.</li>\n<li><b>Processo:</b> execução e adesão. Ex.: % de comparecimento às consultas agendadas.</li>\n<li><b>Resultado / impacto:</b> a mudança real na saúde ou no serviço. É o mais importante. Ex.: aumento de 30% na cobertura vacinal.</li>\n<li><b>Qualitativo:</b> percepção, vínculo, autonomia e estigma (escalas como MANSA e SATIS-BR, grupos focais, mapas de rede antes e depois).</li>\n</ul>\n<h4>Onde registrar e boas práticas</h4>\n<ul>\n<li>Prontuário (e-SUS APS): evolução, CID, CIAP-2 e uma hashtag do projeto no texto livre (ex.: #ProjetoCaminhaSUS) para buscas posteriores.</li>\n<li>Planilhas em nuvem para o acompanhamento das ações do 5W2H; formulários digitais para satisfação e produção dos ACS.</li>\n<li>Defina um <b>guardião dos dados</b>, use os últimos 15 minutos da reunião mensal para revisar os registros e proteja os dados: acesso restrito, nº de prontuário ou CNS no lugar de nomes.</li>\n</ul>", campos:[
      {id:'monitoramento', label:'Estratégia de monitoramento e avaliação', tipo:'textarea', linhas:6, contar:true, ph:'Como e com que frequência o processo será acompanhado e como os resultados serão avaliados.'},
      {id:'indicadores', label:'Indicadores', tipo:'cartoes', nome:'Indicador', ajuda:'Cada cartão é uma linha do Quadro 3 no PDF.', campos:[['tipo','Tipo','sel',[['Estrutura','Estrutura'],['Processo','Processo'],['Resultado','Resultado / impacto'],['Qualitativo','Qualitativo']]],['nome','Indicador','ta','Ex.: Cobertura de citopatológico em mulheres de 25 a 64 anos'],['calculo','Cálculo / fonte','ta','Ex.: nº de mulheres com exame nos últimos 3 anos ÷ total cadastrado × 100 (SISAB)'],['base','Linha de base','in','Ex.: 22%'],['meta','Meta','in','Ex.: 40%'],['freq','Frequência','in','Ex.: Mensal']]},

    {grupo:"Etapa 10 · Registrar", titulo:"Referências", guia:"<p>Liste todas as fontes citadas no texto, segundo a ABNT (NBR 6023). Fontes recomendadas: manuais técnicos de saúde pública e gestão em APS, artigos e revisões em periódicos indexados, Cadernos de Atenção Básica e protocolos do Ministério da Saúde, diretrizes da OMS e sites institucionais oficiais.</p>\n<div class=\"tip\"><b>Formato.</b> BRASIL. Ministério da Saúde. <b>Título da obra</b>: subtítulo. Local: Editora, ano.<br>Escreva o título entre dois asteriscos para sair em negrito no PDF: <code>**Título da obra**</code>.</div>", campos:[

    {grupo:'Conferência e documento', titulo:'Lista de verificação e PDF', guia:"<p>Antes de gerar o documento, confira cada item (Anexo A do guia).</p>\n<div class=\"check\" id=\"checklist\"></div><h4>Formatação do PDF (ABNT)</h4><ul class=\"abnt\"><li>Folha A4, margens de 3 cm (superior e esquerda) e 2 cm (inferior e direita), fonte 12, espaçamento 1,5 e recuo de 1,25 cm na primeira linha.</li>\n          <li>Capa, folha de rosto e sumário automáticos; numeração de páginas no canto superior direito a partir da Introdução, contando desde a folha de rosto.</li>\n          <li>No PDF, a numeração das seções segue a ABNT: começa em 1 na Introdução. Seções em branco são omitidas.</li>\n          <li>Quadros com título acima e fonte abaixo, em fonte 10; referências em espaço simples, separadas por uma linha em branco.</li></ul>", campos:[

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function mesAtual(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function hoje(){ const d=new Date(); return mesAtual()+'-'+pad(d.getDate()); }
function horaAgora(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dataBr(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function dataHoraBr(s){ return s ? dataBr(s.slice(0,10)) + (s.length>10 ? ' às '+s.slice(11,16) : '') : ''; }
function mesBr(m){ if(!m) return 'todos os meses'; const n=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; const p=m.split('-'); return n[Number(p[1])-1]+' de '+p[0]; }

  if(v===undefined) return sessionStorage.getItem(k) || localStorage.getItem(k);

/* Comunicação com o servidor: fetch direto ao endereço do app (funciona com várias contas Google
   logadas no navegador). Se o fetch não estiver disponível, usa google.script.run. */
let CANAL = (typeof EXEC_URL==='string' && /^https:\/\//.test(EXEC_URL)) ? 'fetch' : 'gsr';
function rodarGsr(fn,args){ return new Promise((res,rej)=>{ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args); }); }
async function rodar(fn){
  const args=[].slice.call(arguments,1);
  if(CANAL!=='fetch') return rodarGsr(fn,args);
  let resp;
  try{
    resp = await fetch(EXEC_URL, {method:'POST', redirect:'follow', credentials:'omit', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn:fn, args:args})});
  }catch(e){
    // falha de rede/política do navegador: tenta o canal padrão do Apps Script
    try{ const r=await rodarGsr(fn,args); CANAL='gsr'; return r; }catch(e2){ throw new Error('Sem conexão com o servidor. Verifique a internet e tente novamente.'); }
  }
  let j; try{ j=await resp.json(); }catch(e){ throw new Error('Resposta inválida do servidor ('+resp.status+'). Tente novamente.'); }
  if(!j || !j.ok) throw new Error((j&&j.erro)||'Erro no servidor.');
  return j.r;
}
async function call(acao, dados, silencioso){
  busy(true);
  try { return await rodar('api', S.token, acao, dados||{}); }
  catch(e){
    const m=msgErro(e);
    if(m.indexOf('SESSAO')>-1){ sairLocal(); toast('Sessão encerrada. Entre novamente.'); }
    else if(m.indexOf('TROCAR_SENHA')>-1){ telaTrocaObrigatoria(); }
    else if(!silencioso) toast(m,'err');
    throw e;
  } finally { busy(false); }
}

window.addEventListener('load', ()=>{
  const seguir=loc=>{
    const p=(loc&&loc.parameter)||{};
    if(p.p==='meta4') return telaMeta4Publica(p.u);
    inicioNormal();
  };

});
function inicioNormal(){
  const t=store('tk');
  try{ S.lembrar=!!localStorage.getItem('tk'); }catch(e){}
  if(t){ S.token=t; iniciar(); return; }
  telaLogin();
  rodar('identidade').then(r=>{ S.programa=r.programa||PROGRAMA_PADRAO; S.logos=(r.logos&&r.logos.length)?r.logos:LOGOS_PADRAO; if(!S.token && $('#fLogin')) telaLogin(); }).catch(()=>{});

function telaLogin(){
  $('#app').innerHTML =
   '<div class="login"><div class="card" id="fLogin">'+
   (faixaLogos()||marca())+'<h1>Plataforma da Preceptoria</h1>'+
   '<p class="mut sm">'+esc(S.programa)+' · Fiocruz / SEMS Dourados-MS</p>'+
   '<div class="fld"><label class="lbl" for="lgU">Usuário</label><input type="text" id="lgU" autocomplete="username" autocapitalize="none"></div>'+
   '<div class="fld"><label class="lbl" for="lgS">Senha</label><input type="password" id="lgS" autocomplete="current-password"></div>'+
   '<label class="lembrar"><input type="checkbox" id="lgL"'+(NO_APP?' checked':'')+'> Manter conectado neste aparelho</label>'+
   '<div class="erro-m" id="lgE"></div>'+

async function fazerLogin(){
  const u=val('lgU'), s=$('#lgS').value;
  if(!u||!s){ $('#lgE').textContent='Informe usuário e senha.'; return; }
  $('#lgB').disabled=true; $('#lgE').textContent=''; busy(true);
  const lembrar=!!($('#lgL')&&$('#lgL').checked);
  try{ const r=await rodar('login',u,s,lembrar,(NO_APP?'App Android':'Navegador')+' · '+navigator.userAgent.slice(0,90)); S.lembrar=lembrar; S.token=r.token; store('tk',r.token); await iniciar(); }
  catch(err){ const e=$('#lgE'); if(e) e.textContent=msgErro(err); const b=$('#lgB'); if(b) b.disabled=false; }
  finally{ busy(false); }
}

async function iniciar(){
  let r;
  try{ r=await call('init',{},true); }catch(e){ if(!S.token) return; sairLocal(); return; }
  r.url = window.PAGINA_EXTERNA ? location.origin+location.pathname : r.url;
  S.eu=r.eu; S.programa=r.programa||PROGRAMA_PADRAO; S.logos=(r.logos&&r.logos.length)?r.logos:LOGOS_PADRAO; S.logosCfg=r.logosCfg||[]; S.usuarios=r.usuarios; S.config=r.config; S.tipos=r.tipos; S.url=r.url; S.naoLidas=r.naoLidas;
  if(r.trocarSenha) return telaTrocaObrigatoria();
  montarShell(); ir('inicio');
  clearInterval(S.poll); S.poll=setInterval(atualizarSino, 120000);
}

function sairLocal(){ clearInterval(S.poll); store('tk',null); S.token=null; S.eu=null; fecharModal(); telaLogin(); }
function sair(){ const t=S.token; rodar('sair',t).catch(()=>{}); sairLocal(); }

function telaTrocaObrigatoria(){

function ir(rota, params){

function minhaPendencia(r){ return r.assinaturas.some(a=>a.usuario_id===S.eu.id && a.status==='pendente'); }
function podeAbrir(r){
  if(r.autor_id===S.eu.id || r.residente_id===S.eu.id) return true;
  if(r.assinaturas.some(a=>a.usuario_id===S.eu.id)) return true;
  if(r.tipo==='FEEDBACK' || r.tipo==='SUPERVISAO') return false;
  return GESTAO.indexOf(S.eu.perfil)>-1;
}
function cardReg(r){
  const ab=podeAbrir(r);
  const nAss=r.assinaturas.filter(a=>a.status==='assinado').length;
  const pessoas=[r.autor, r.residente && r.residente!==r.autor ? (r.tipo==='SUPERVISAO'?'Preceptor(a): ':'Residente: ')+r.residente : ''].filter(Boolean).join(' · ');
  return '<div class="card reg '+(ab?'click':'')+'" '+(ab?'onclick="ir(\'doc\',{id:\''+r.id+'\'})"':'')+'>'+
    '<div class="reg-top"><span class="tipo">'+esc(S.tipos[r.tipo].nome)+'</span>'+chip(r.status)+'</div>'+
    '<div class="reg-tit">'+esc(r.titulo)+'</div>'+
    '<div class="reg-meta">'+dataBr(r.data)+(r.hora?' · '+esc(r.hora):'')+' · '+esc(pessoas)+(r.assinaturas.length?' · '+nAss+'/'+r.assinaturas.length+' assinaturas':'')+'</div>'+
    (r.tipo==='PI' ? '<div class="met"><div class="lin"><span>Preenchimento</span><b>'+r.progresso+'%</b></div>'+barra(r.progresso)+'</div>' : '')+
    (minhaPendencia(r) ? '<div class="alerta">Aguardando sua assinatura</div>' : '')+
    (!ab ? '<div class="mut sm" style="margin-top:6px">Conteúdo restrito '+(r.tipo==='SUPERVISAO'?'ao supervisor e ao preceptor':'ao preceptor e ao residente')+'.</div>' : '')+
  '</div>';
}
function listaCards(arr, vazio){ return arr.length ? arr.map(cardReg).join('') : '<div class="card vazio">'+esc(vazio)+'</div>'; }

async function vInicio(){
  const primeiro=S.eu.nome.split(' ')[0];
  view('<div class="pg-head"><div><h1>Olá, '+esc(primeiro)+'</h1><p class="mut">'+esc(PERFIL_NOME[S.eu.perfil])+' · '+mesBr(mesAtual())+'</p></div></div><div id="ini"><div class="vazio">Carregando…</div></div>');
  let regs=[]; try{ regs=await call('listar',{}); }catch(e){ return; }
  const box=$('#ini'); if(!box) return;
  const pend=regs.filter(minhaPendencia);
  let h='<h3 class="sec-t">Pendências de assinatura</h3>'+listaCards(pend,'Nenhum documento aguardando sua assinatura.');

  const atalho='<p style="margin:4px 0 14px"><button class="btn" onclick="ir(\'editar\',{tipo:\'META4\'})">+ Registrar atividade da Meta 4</button></p>';
  if(S.eu.perfil==='colaborador'){
    box.innerHTML=atalho+'<h3 class="sec-t">Meus registros da Meta 4</h3>'+listaCards(regs.filter(r=>r.tipo==='META4').slice(0,15),'Nenhuma atividade registrada ainda.'); return;
  }
  if(S.eu.perfil==='residente'){
    h=atalho+h; h+='<h3 class="sec-t">Meus documentos recentes</h3>'+listaCards(regs.filter(r=>!minhaPendencia(r)).slice(0,10),'Nenhum documento registrado.');
    box.innerHTML=h; return;
  }
  let kp='';
  if(S.eu.perfil==='preceptor') try{
    const p = await call('meuPainel',{mes:mesAtual()},true);
    const l = p.linhas[0];
    if(l){
      kp='<h3 class="sec-t">Minhas metas pedagógicas · '+mesBr(p.mes)+'</h3><div class="grid g4">'+
        kpiMeta('Feedbacks semanais', l.feedback, p.metas.FEEDBACK)+
        kpiMeta('Revisões de prontuário', l.prontuario, p.metas.PRONTUARIO)+
        kpiMeta('Canais de núcleo', l.canal, p.metas.CANAL)+
        kpiMeta('Atas de reunião', l.ata, p.metas.ATA)+
        '<div class="kpi"><span>Projeto de intervenção</span><b>'+l.pi+'%</b>'+barra(l.pi)+'<small>'+(l.piConcluido?'Concluído':'preenchido')+'</small></div>'+
        '<div class="kpi"><span>Feedback da supervisão</span><b>'+l.supervisao+'</b><small> recebido(s) no mês</small></div>'+
      '</div>';
    }
  }catch(e){}
  const aguardando=regs.filter(r=>r.autor_id===S.eu.id && r.status==='aguardando');
  const rasc=regs.filter(r=>r.autor_id===S.eu.id && r.status==='rascunho');
  h = kp + atalho + h + '<h3 class="sec-t">Enviados, aguardando outras assinaturas</h3>'+listaCards(aguardando,'Nenhum documento aguardando assinatura de terceiros.')+
      (rasc.length?'<h3 class="sec-t">Meus rascunhos</h3>'+listaCards(rasc,''):'');
  if(S.eu.perfil!=='preceptor') h+='<p style="margin-top:16px"><button class="btn pri" onclick="ir(\'painel\')">Abrir painel mensal da preceptoria</button></p>';
  box.innerHTML=h;
}
function kpiMeta(rot, n, meta){
  const p = meta ? Math.min(100, Math.round(n/meta*100)) : 0;
  return '<div class="kpi"><span>'+esc(rot)+'</span><b>'+n+'</b><small> / meta '+meta+'</small>'+barra(p)+'<small>'+p+'% da meta</small></div>';
}

/* ======================= CAMPOS (EDIÇÃO E LEITURA) ======================= */

const DEF = {};          // definições dos campos em edição (por id)
let PDI_ROWS = [];       // linhas do plano do PDI em edição

function opcoesUsuarios(perfis, excluirEu){
  return S.usuarios.filter(u=>perfis.indexOf(u.perfil)>-1 && u.ativo && !(excluirEu && u.id===S.eu.id));
}
function catResidente(){ const u=S.usuarios.find(x=>x.id===val('f__res')); return u ? (u.categoria||'') : ''; }
function rotulo(c, paraId){
  const t=esc(c.label)+(c.obrig?' <span class="req">*</span>':'');
  return paraId ? '<label class="lbl" for="'+paraId+'">'+t+'</label>' : '<span class="lbl">'+t+'</span>';
}
function oculto(c, conteudo){
  if(!c.mostrarSe) return false;
  const dep=DEF[c.mostrarSe[0]] || camposTodos().find(x=>x.id===c.mostrarSe[0]);
  if(dep && oculto(dep, conteudo)) return true;
  const v = conteudo ? conteudo[c.mostrarSe[0]] : (dep && document.getElementById('w_'+dep.id) ? lerCampo(dep) : '');
  return c.mostrarSe[1]==='*' ? !v : v!==c.mostrarSe[1];
}
function camposTodos(){ return Object.keys(FORMS).reduce((a,k)=>a.concat(camposDe(FORMS[k])),[]).filter(c=>c.id); }
function vazio(v){ if(Array.isArray(v)) return !v.length; if(v && typeof v==='object') return !Object.keys(v).filter(k=>k.indexOf('__')!==0).length; return !String(v==null?'':v).trim(); }
function vazioCampo(c, v){ if(c.padrao!==undefined && v===c.padrao) return true; return vazio(v); }

function campoHTML(c, v){
  if(c.tipo==='bloco'){ if(c.mostrarSe){ c.id=c.id||('blk_'+Math.random().toString(36).slice(2,8)); DEF[c.id]=c; } return '<div class="bloco"'+(c.mostrarSe?' id="w_'+c.id+'"':'')+'><h3 class="blk-t">'+(c.num?'<span class="n">'+esc(c.num)+'</span>':'')+esc(c.label)+'</h3>'+(c.orient?'<div class="orient">'+c.orient+'</div>':'')+'</div>'; }
  DEF[c.id]=c;
  if(v===undefined && c.padrao!==undefined) v=c.padrao;
  if(v===undefined && c.padraoEu && S.eu) v=S.eu.nome;
  const id='f_'+c.id, ph=c.ph?' placeholder="'+esc(c.ph)+'"':'';
  const ajuda=c.ajuda?'<div class="mut sm" style="margin-top:4px">'+esc(c.ajuda)+'</div>':'';
  const abre='<div class="fld" id="w_'+c.id+'">';
  if(c.tipo==='text') return abre+rotulo(c,id)+'<input type="text" id="'+id+'" value="'+esc(v||'')+'"'+ph+'>'+ajuda+'</div>';
  if(c.tipo==='date') return abre+rotulo(c,id)+'<input type="date" id="'+id+'" value="'+esc(v||'')+'">'+ajuda+'</div>';
  if(c.tipo==='month') return abre+rotulo(c,id)+'<input type="month" id="'+id+'" value="'+esc(v||'')+'">'+ajuda+'</div>';
  if(c.tipo==='textarea') return abre+rotulo(c,id)+'<textarea id="'+id+'" rows="'+(c.linhas||4)+'"'+ph+(c.max?' maxlength="'+c.max+'"':'')+'>'+esc(v||'')+'</textarea>'+(c.max?'<div class="mut sm" style="text-align:right">até '+c.max+' caracteres</div>':'')+(c.contar?'<div class="count" id="cnt_'+c.id+'"></div>':'')+ajuda+'</div>';
  if(c.tipo==='faces') return abre+rotulo(c)+'<div class="faces" id="'+id+'">'+FACE_ROTULOS.map((r,i)=>'<label class="face"><input type="radio" name="'+id+'" value="'+esc(r)+'"'+(v===r?' checked':'')+'><span><img src="'+FACE_IMG[i]+'" alt=""><small>'+esc(r)+'</small></span></label>').join('')+'</div>'+ajuda+'</div>';
  if(c.tipo==='select') return abre+rotulo(c,id)+'<select id="'+id+'"><option value="">Selecione…</option>'+
      c.opcoes.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'+ajuda+'</div>';
  if(c.tipo==='usuario') return abre+rotulo(c,id)+'<select id="'+id+'"><option value="">Selecione…</option>'+

  if(c.tipo==='chips' || c.tipo==='chipsm'){

  }
  if(c.tipo==='calcCrono') return '<div class="fld" id="w_'+c.id+'"><span class="lbl">'+esc(c.label)+'</span><div class="calc" id="piCrono">Adicione atividades para calcular.</div></div>';
  if(c.tipo==='escala') return escalaHTML(c, v);
  if(c.tipo==='anexos'){
    ANEXOS[c.id]=(v||[]).slice();
    return abre+rotulo(c)+'<div class="anx" id="'+id+'"></div><label class="btn sm anx-add"><input type="file" accept="'+esc(c.aceita)+'" multiple onchange="anexar(\''+c.id+'\',this)"> + Adicionar arquivos</label>'+ajuda+'</div>';
  }
  if(c.tipo==='cartoes'){
    const arr=(Array.isArray(v)&&v.length&&!Array.isArray(v[0]))?v:[{}];
    return abre+rotulo(c)+'<div class="cartoes" id="'+id+'">'+arr.map((r,i)=>cartaoHTML(c,r,i)).join('')+'</div>'+

function lerCampo(c){
  const id='f_'+c.id;
  if(c.tipo==='bloco' || c.tipo==='calcCrono') return undefined;
  if(c.tipo==='multi' || c.tipo==='chipsm') return $$('[name="'+id+'"]:checked').map(x=>x.value);
  if(c.tipo==='chips' || c.tipo==='faces'){ const x=document.querySelector('[name="'+id+'"]:checked'); return x?x.value:''; }
  if(c.tipo==='escala'){
    const o={};
    $$('#w_'+c.id+' .esc-i[data-item]').forEach(div=>{ const s=div.querySelector('input:checked'); if(s) o[div.dataset.item]=s.value; });
    $$('#w_'+c.id+' .esc-obs').forEach(t=>{ if(t.value.trim()) o['__obs_'+t.dataset.k]=t.value.trim(); });
    if(c.porCategoria) o.__cat=catResidente();
    return o;
  }
  if(c.tipo==='cartoes'){
    return $$('#'+id+' .cartao').map(card=>{ const o={}; card.querySelectorAll('[data-c]').forEach(el=>{ o[el.dataset.c]=el.value.trim(); }); return o; })
      .filter(o=>c.campos.some(f=>f[2]!=='sel' && o[f[0]]));
  }
  if(c.tipo==='anexos') return (ANEXOS[c.id]||[]).filter(a=>a.id).map(a=>({id:a.id, relId:a.relId||'', nome:a.nome, mime:a.mime}));
  if(c.tipo==='pdi'){ pdiSync(); return PDI_ROWS.filter(r=>r.texto && r.texto.trim()).map(r=>Object.assign({},r)); }
  return val(id);
}

/* ---------- escala (SOAP, atividades) ---------- */
function gruposEscala(c, cat){
  const g=c.grupos.slice();
  if(c.porCategoria){
    const its=c.porCategoria.mapa[cat];
    g.push({k:c.porCategoria.k, titulo:c.porCategoria.titulo+(cat?' · '+cat:''), itens:its||[], vazio:!its});
  }
  return g;
}
function escalaHTML(c, v){
  v=v||{}; const niv=c.niveis||NIVEIS, id='f_'+c.id;
  const cat = c.porCategoria ? (document.getElementById('f__res') ? catResidente() : v.__cat) : '';
  return '<div class="fld" id="w_'+c.id+'">'+rotulo(c)+gruposEscala(c, cat).map((g,gi)=>
    '<div class="esc-g"><h4>'+esc(g.titulo)+(g.sub?' <small>'+esc(g.sub)+'</small>':'')+'</h4>'+
    (g.vazio?'<div class="esc-i mut sm">Selecione um residente com categoria cadastrada (Enfermagem, Fisioterapia, Nutrição, Odontologia ou Psicologia) para exibir os critérios específicos.</div>':'')+
    g.itens.map((it,ii)=>{
      const t=Array.isArray(it)?it[0]:it, e=Array.isArray(it)?it[1]:'', nm=id+'_'+gi+'_'+ii, cod=g.k?g.k+(ii+1):'';
      return '<div class="esc-i" data-item="'+esc(t)+'"><p>'+(cod?'<b class="cod">'+cod+'</b> ':'')+esc(t)+(e?'<span class="ev">'+esc(e)+'</span>':'')+'</p><div class="esc-op">'+
        niv.map(n=>'<label><input type="radio" name="'+nm+'" value="'+n[0]+'"'+(v[t]===n[0]?' checked':'')+'><span>'+esc(n[1])+'</span></label>').join('')+'</div></div>';
    }).join('')+
    (c.obsGrupo&&g.k&&!g.vazio?'<div class="esc-i"><textarea class="esc-obs" data-k="'+g.k+'" rows="2" placeholder="Observações do(a) preceptor(a) – bloco '+g.k+'">'+esc(v['__obs_'+g.k]||'')+'</textarea></div>':'')+
    '</div>').join('')+'<div class="esc-res" id="'+id+'_score"></div></div>';
}
function totalItens(c, cat){ return gruposEscala(c, cat).reduce((s,g)=>s+g.itens.length,0); }
function respondidos(v){ return Object.keys(v||{}).filter(k=>k.indexOf('__')!==0).length; }
function pontuacao(v){ let s=0,m=0; Object.keys(v||{}).forEach(k=>{ if(k.indexOf('__')===0) return; const x=v[k]; if(x!=='NA' && !isNaN(Number(x))){ s+=Number(x); m+=2; } }); return m ? {pct:Math.round(s/m*1000)/10, pts:s, max:m} : null; }
function classIQR(p){ return p>=85?['Adequado','ok']:p>=70?['Parcialmente adequado','warn']:['Inadequado','bad']; }
function resumoEscala(c, v, cat){
  const tot=totalItens(c, cat), n=respondidos(v);
  if(c.pontuar===false){
    const niv=c.niveis||NIVEIS; const cont=niv.map(x=>x[1]+': '+Object.keys(v||{}).filter(k=>v[k]===x[0]).length);
    return n+'/'+tot+' itens · '+cont.join(' · ');
  }
  const p=pontuacao(v); if(!p) return n+'/'+tot+' itens avaliados';
  let h=n+'/'+tot+' itens avaliados · '+p.pts+'/'+p.max+' pts';
  if(c.iqr){ const k=classIQR(p.pct); h+=' · IQR <span class="score '+k[1]+'">'+String(p.pct).replace('.',',')+'% — '+k[0]+(n<tot?' (parcial)':'')+'</span>'; }
  return h;
}
function atualizarEscalas(){
  Object.keys(DEF).forEach(k=>{ const c=DEF[k]; if(c.tipo!=='escala') return; const el=$('#f_'+c.id+'_score'); if(el) el.innerHTML=resumoEscala(c, lerCampo(c), c.porCategoria?catResidente():''); });
}
function aplicarVisibilidade(){
  Object.keys(DEF).forEach(k=>{ const c=DEF[k]; if(!c.mostrarSe) return; const w=$('#w_'+c.id); if(w) w.style.display=oculto(c)?'none':''; });
}

function pdiRem(id){ pdiSync(); PDI_ROWS=PDI_ROWS.filter(r=>r.id!==id); renderPdi(); }
function pdiPrazo(id,n){ pdiSync(); const r=PDI_ROWS.find(x=>x.id===id); r.prazo=addDias(n); renderPdi(); }
function pdiSug(id,bt){ pdiSync(); const r=PDI_ROWS.find(x=>x.id===id), s='• '+bt.textContent; if((r.acoes||'').indexOf(s)===-1) r.acoes=(r.acoes?r.acoes.replace(/\s+$/,'')+'\n':'')+s; renderPdi(); }
function pdiResp(id,bt){ pdiSync(); const r=PDI_ROWS.find(x=>x.id===id), p=bt.textContent; const i=r.resp.indexOf(p); if(i>-1) r.resp.splice(i,1); else r.resp.push(p); renderPdi(); }

const MZ={aba:'campo', busca:'', tipo:'', sel:{}};
const normTxt=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function chaveMz(o,d,t,x){ return o+'|'+d+'|'+t+'|'+x; }
function abrirMatriz(){

function mzAba(a){ MZ.aba=a; $('#mzC').classList.toggle('on',a==='campo'); $('#mzN').classList.toggle('on',a==='nucleo'); renderMatriz(); }
function renderMatriz(){

  if(MZ.aba==='campo') grupos=MATRIZ.CAMPO.map(g=>({o:'campo', d:g.d, comp:g.comp, g:g}));

  const b=normTxt(MZ.busca.trim()), noPlano=k=>PDI_ROWS.some(r=>chaveMz(r.origem,r.dominio,r.tipo,r.texto)===k);

/* ---------- anexos (Meta 4) ---------- */
const ANEXOS = {};
let ENVIAR_ANEXO = d=>call('enviarAnexo', d, true);
const CACHE_IMG = {};
function lerArquivo(f){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>err(new Error('Não foi possível ler '+f.name)); r.readAsDataURL(f); }); }
function reduzir(dataUrl, max, q){ return new Promise((ok,err)=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k)); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',q)); }; im.onerror=()=>err(new Error('Imagem inválida ou formato não suportado.')); im.src=dataUrl; }); }
function pintarAnexos(id){
  const box=$('#f_'+id); if(!box) return;
  const arr=ANEXOS[id]||[];
  box.innerHTML=arr.length?arr.map((a,i)=>'<div class="anx-it">'+(a.mime==='application/pdf'?'<div class="anx-ic">PDF</div>':'<img '+(a.thumb?'src="'+a.thumb+'"':'data-anx="'+esc(a.relId||a.id||'')+'"')+' alt="">')+
    '<span>'+esc(a.nome)+(a.enviando?' · enviando…':'')+'</span><button type="button" class="x" title="Remover" onclick="remAnexo(\''+id+'\','+i+')">×</button></div>').join(''):'<div class="mut sm">Nenhum arquivo anexado.</div>';
  carregarMiniaturas(box);
}
function remAnexo(id,i){ ANEXOS[id].splice(i,1); pintarAnexos(id); }
async function anexar(id, input){
  const c=DEF[id], files=Array.from(input.files||[]); input.value='';
  for(const f of files){
    if((ANEXOS[id]||[]).length>=c.max){ toast('Limite de '+c.max+' arquivos neste campo.','err'); break; }
    const pdf=f.type==='application/pdf';
    if(!pdf && f.type.indexOf('image/')!==0){ toast(f.name+': formato não permitido.','err'); continue; }
    if(pdf && f.size>10*1024*1024){ toast(f.name+': PDF acima de 10 MB.','err'); continue; }
    const item={nome:f.name, mime:pdf?'application/pdf':'image/jpeg', enviando:true};
    ANEXOS[id].push(item); pintarAnexos(id);
    try{
      const bruto=await lerArquivo(f); let d;
      if(pdf) d={nome:f.name, mime:'application/pdf', base64:bruto.split(',')[1]};
      else { const g=await reduzir(bruto,1600,.82), r=await reduzir(bruto,800,.7); item.thumb=await reduzir(bruto,220,.7);
        d={nome:f.name.replace(/\.\w+$/,'')+'.jpg', mime:'image/jpeg', base64:g.split(',')[1], base64Rel:r.split(',')[1]}; item.nome=d.nome; }
      const res=await ENVIAR_ANEXO(d);
      Object.assign(item,{id:res.id, relId:res.relId, enviando:false});
    }catch(e){ ANEXOS[id]=ANEXOS[id].filter(x=>x!==item); toast(f.name+': '+msgErro(e),'err'); }
    pintarAnexos(id);
  }
}
async function carregarMiniaturas(root){

  }
}
async function abrirAnexo(id){
  try{
    const a=await call('anexo',{id:id});
    const bin=atob(a.base64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:a.mime}));

    if(!w){ const l=document.createElement('a'); l.href=url; l.download=a.nome; document.body.appendChild(l); l.click(); l.remove(); }

function semanaEpi(iso){
  if(!iso) return '';
  const p=iso.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]);
  const ini=y=>{ const j=new Date(y,0,4); return new Date(y,0,4-j.getDay()); };
  let y=d.getFullYear(), s=ini(y); if(d<s){ y--; s=ini(y); } else if(d>=ini(y+1)){ y++; s=ini(y); }
  const se=Math.floor((d-s)/864e5/7)+1, dom=new Date(d); dom.setDate(d.getDate()-d.getDay()); const sab=new Date(dom); sab.setDate(dom.getDate()+6);
  const f=x=>pad(x.getDate())+'/'+pad(x.getMonth()+1);
  return 'SE '+se+' · '+f(dom)+' a '+f(sab)+'/'+sab.getFullYear();
}

function calcCrono(fases){
  const f=(fases||[]).filter(x=>x && x.atividade);
  if(!f.length) return {txt:'Adicione atividades para calcular.', alerta:''};
  const N=Math.max.apply(null, f.map(x=>Math.max(+x.fim||0, +x.ini||0, 1)));
  const fase=k=>{ const g=f.filter(x=>String(x.fase)===k); if(!g.length) return '—'; const a=Math.min.apply(null,g.map(x=>+x.ini||1)), b=Math.max.apply(null,g.map(x=>+x.fim||+x.ini||1)); return 'mês '+a+(b>a?' a '+b:''); };
  let alerta=''; if(N<6) alerta='Abaixo de 6 meses: confira se as três fases cabem no prazo.'; else if(N>12) alerta='Acima de 12 meses: há risco de descontinuidade; considere reduzir o escopo.';
  if(!f.some(x=>String(x.fase)==='3')) alerta+=(alerta?' ':'')+'Inclua a fase de avaliação e consolidação.';
  return {txt:'<b>'+N+' '+(N===1?'mês':'meses')+'</b> · Planejamento: '+fase('1')+' · Execução: '+fase('2')+' · Avaliação: '+fase('3'), alerta:alerta};
}

  if(FORMS[d.tipo].participantes && !(d.participantes||[]).length) f.push('Participantes');
  campos.forEach(c=>{
    const obr = c.obrig || (c.obrigSe && d.conteudo[c.obrigSe[0]]===c.obrigSe[1]);
    if(!obr || oculto(c, d.conteudo)) return;
    const v=d.conteudo[c.id];
    if(c.tipo==='escala'){ if(respondidos(v)<totalItens(c, c.porCategoria?catResidente():'')) f.push('todos os itens de “'+c.label+'”'); }
    else if(vazio(v)) f.push(c.label);
  });
  return f;
}

async function salvarReg(modo){
  const x=coletar(), d=x.d;
  if(Object.keys(ANEXOS).some(k=>(ANEXOS[k]||[]).some(a=>a.enviando))) return toast('Aguarde o envio dos arquivos terminar.','err');
  if(['enviar','registrar','concluir'].indexOf(modo)>-1){
    const f=faltando(d, x.campos); if(f.length) return toast('Preencha: '+f.join('; '),'err');
  } else if(!d.data || (S.tipos[d.tipo].residente && !d.residente_id)){
    return toast('Informe ao menos a data'+(S.tipos[d.tipo].residente?(FORMS[d.tipo].alvo?' e o(a) preceptor(a)':' e o residente'):'')+'.','err');
  }
  if(d.tipo==='PI' && modo==='parcial' && !d.conteudo.titulo_pi) return toast('Informe o título do projeto na etapa 1.','err');

  if(modo==='enviar'){
    const quem = d.tipo==='ATA' ? 'os participantes selecionados' : FORMS[d.tipo].alvo ? 'o(a) preceptor(a)' : 'o(a) residente';
    return modalSenha('Assinar e enviar', 'Ao confirmar, o documento recebe sua assinatura eletrônica, é <b>bloqueado para edição</b> e '+quem+' será notificado(a) na plataforma para assinar.', '', async senha=>{
      d.enviar=true; d.senha=senha;
      const r=await call('salvar', d, true); fecharModal(); toast('Documento assinado e enviado.','ok'); ir('doc',{id:r.id});
    });
  }
  if(modo==='concluir'){
    return confirmar('Concluir projeto', 'Após a conclusão, o projeto não poderá mais ser editado. Deseja continuar?', 'Concluir', async ()=>{
      d.concluir=true; try{ const r=await call('salvar', d); toast('Projeto concluído.','ok'); ir('doc',{id:r.id}); }catch(e){}
    });
  }
  try{
    const r=await call('salvar', d); S.edit.id=r.id;
    if(modo==='registrar'){ toast('Registro salvo.','ok'); return ir('doc',{id:r.id}); }
    toast(modo==='parcial' ? 'Progresso salvo ('+d.progresso+'% preenchido).' : 'Rascunho salvo.','ok');
  }catch(e){}
}

/* ======================= GERADOR DO PDF EM ABNT (NBR 14724 / 15287 / 6023) ======================= */
/* Gerador do PDF em ABNT (NBR 14724 / 15287 / 6023). Recebe o estado e o construtor jsPDF. */
function buildPDF(S, jsPDF){
  var F = (S.opts && S.opts.fonte === 'helvetica') ? 'helvetica' : 'times';
  if (jsPDF.API && !jsPDF.API.autoTable && typeof window !== 'undefined' && window.jspdf_autotable && window.jspdf_autotable.applyPlugin) window.jspdf_autotable.applyPlugin(jsPDF);
  var doc = new jsPDF({unit:'mm', format:'a4'});
  var PW=210, PH=297, ML=30, MR=20, MT=30, MB=20, W=PW-ML-MR, PT=0.3528;
  var LH = 12*1.5*PT, LS = 12*1.2*PT, L10 = 10*1.2*PT;
  var y = MT, toc = [];
  var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  function clean(s){
    return String(s == null ? '' : s)
      .replace(/[‘’‚]/g, "'").replace(/[“”„]/g, '"')
      .replace(/[–—−]/g, '-').replace(/…/g, '...')
      .replace(/[•●▪]/g, '-').replace(/[   ]/g, ' ')
      .replace(/\r/g, '').replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g, '');
  }
  function has(s){ return clean(s).replace(/\*\*/g,'').trim().length > 0; }
  function paras(s){ return clean(s).split(/\n/).map(function(t){return t.trim();}).filter(Boolean); }
  function setF(st, size){ doc.setFont(F, st); doc.setFontSize(size); }
  function newPage(){ doc.addPage(); y = MT; }
  function room(h){ if (y + h > PH - MB + 0.01) newPage(); }

  function tokens(text, base){
    var segs = [], re = /\*\*([^*]+)\*\*/g, last = 0, m;
    while ((m = re.exec(text))){
      if (m.index > last) segs.push({t:text.slice(last, m.index), st:base});
      segs.push({t:m[1], st:'bold'}); last = re.lastIndex;
    }
    if (last < text.length) segs.push({t:text.slice(last), st:base});
    var words = [], cur = null;
    segs.forEach(function(sg){
      sg.t.split(/(\s+)/).forEach(function(b){
        if (b === '') return;
        if (/^\s+$/.test(b)){ cur = null; return; }
        if (!cur){ cur = {parts:[]}; words.push(cur); }
        cur.parts.push({t:b, st:sg.st});
      });
    });
    return words;
  }
  function wordW(w, size){ var s=0; w.parts.forEach(function(p){ setF(p.st, size); s += doc.getTextWidth(p.t); }); return s; }
  function breakLong(words, width, size){
    var out = [];
    words.forEach(function(w){
      if (wordW(w, size) <= width){ out.push(w); return; }
      var st = w.parts[0].st, txt = w.parts.map(function(p){return p.t;}).join(''), chunk = '';
      setF(st, size);
      for (var i=0;i<txt.length;i++){
        if (doc.getTextWidth(chunk + txt[i]) > width && chunk){ out.push({parts:[{t:chunk, st:st}]}); chunk=''; }
        chunk += txt[i];
      }
      if (chunk) out.push({parts:[{t:chunk, st:st}]});
    });
    return out;
  }
  function layout(text, o){
    var size=o.size, words = breakLong(tokens(text, o.base), o.width - o.indent, size);
    setF('normal', size); var sp = doc.getTextWidth(' ');
    var lines = [], line = [], lw = 0, avail = o.width - o.indent, ind = o.indent;
    words.forEach(function(w){
      var ww = wordW(w, size);
      if (line.length && lw + sp + ww > avail){
        lines.push({words:line, lw:lw, avail:avail, ind:ind}); line=[]; lw=0; avail=o.width; ind=0;
      }
      lw += (line.length ? sp : 0) + ww; line.push({w:w, ww:ww});
    });
    if (line.length) lines.push({words:line, lw:lw, avail:avail, ind:ind, last:true});
    return {lines:lines, sp:sp};
  }
  function drawLine(L, sp, o, yTop){
    var size=o.size, yb = yTop + o.lh*0.72, x;
    if (o.align === 'center') x = o.x + (o.width - L.lw)/2;
    else if (o.align === 'right') x = o.x + o.width - L.lw;
    else x = o.x + L.ind;
    var gap = sp;
    if (o.align === 'justify' && !L.last && L.words.length > 1){
      var sum = L.words.reduce(function(a,b){return a+b.ww;},0);
      gap = (L.avail - sum)/(L.words.length-1);
    }
    L.words.forEach(function(it){
      it.w.parts.forEach(function(p){ setF(p.st, size); doc.text(p.t, x, yb); x += doc.getTextWidth(p.t); });
      x += gap;
    });
  }
  function block(text, opt){
    var o = Object.assign({size:12, lh:LH, indent:12.5, align:'justify', base:'normal', x:ML, width:W, keep:1}, opt||{});
    var r = layout(text, o);
    r.lines.forEach(function(L, i){
      room(i === 0 ? o.lh*o.keep : o.lh);
      drawLine(L, r.sp, o, y); y += o.lh;
    });
  }
  function para(text, opt){ paras(text).forEach(function(p){ block(p, opt); }); }

  // ---------- títulos e seções ----------
  var sec = 0, sub = 0, headEnd = -1, headPage = -1;
  function h1(title){
    sec++; sub = 0;
    if (y > MT) y += LH;
    room(LH*7);
    var label = sec + ' ' + title.toUpperCase();
    toc.push({label:label, page:doc.getNumberOfPages(), lvl:1});
    block(label, {indent:0, align:'left', base:'bold'});
    y += LH; headEnd = y; headPage = doc.getNumberOfPages();
  }
  function h2(title){
    sub++;
    if (!(Math.abs(y - headEnd) < 0.01 && headPage === doc.getNumberOfPages())) y += LH;
    room(LH*4);
    var label = sec + '.' + sub + ' ' + title.toUpperCase();
    toc.push({label:label, page:doc.getNumberOfPages(), lvl:2});
    block(label, {indent:0, align:'left'});
    y += LH;
  }
  function hUnnum(title){
    if (y > MT) y += LH;
    room(LH*4);
    toc.push({label:title.toUpperCase(), page:doc.getNumberOfPages(), lvl:0});
    block(title.toUpperCase(), {indent:0, align:'center', base:'bold'});
    y += LH;
  }
  var nQuadro = 0;
  function quadro(titulo, head, body, colStyles){
    nQuadro++;
    y += LH*0.5; room(L10*2 + 20);
    block('**Quadro ' + nQuadro + '** - ' + titulo, {size:10, lh:L10, indent:0, align:'center'});
    y += 1;
    doc.autoTable({
      startY:y, head:[head], body:body, theme:'grid',
      margin:{left:ML, right:MR, top:MT, bottom:MB},
      styles:{font:F, fontSize:10, cellPadding:1.4, textColor:0, lineColor:[0,0,0], lineWidth:0.2, valign:'top', overflow:'linebreak'},
      headStyles:{fillColor:[235,235,235], textColor:0, fontStyle:'bold', halign:'center', valign:'middle'},
      columnStyles:colStyles || {}
    });
    y = doc.lastAutoTable.finalY + 1.2;
    room(L10);
    block('Fonte: Elaborado pelo(s) autor(es) (' + clean(S.meta.ano || '') + ').', {size:10, lh:L10, indent:0, align:'left'});
    y += LH*0.5;
  }

  var M = S.meta || {};
  var autores = paras(M.autores);
  var tituloTxt = '**' + clean(M.titulo || 'TÍTULO DO PROJETO').toUpperCase() + '**' + (has(M.subtitulo) ? ': ' + clean(M.subtitulo) : '');

  // ---------- CAPA ----------
  paras(M.instituicao).forEach(function(l){ block(l.toUpperCase(), {indent:0, align:'center', base:'bold'}); });
  y = 95;
  autores.forEach(function(a){ block(a.toUpperCase(), {indent:0, align:'center'}); });
  y = 145;
  block(tituloTxt, {indent:0, align:'center'});
  y = PH - MB - LH*2;
  block(clean(M.cidade || ''), {indent:0, align:'center'});
  block(clean(M.ano || ''), {indent:0, align:'center'});

  // ---------- FOLHA DE ROSTO ----------
  newPage();
  autores.forEach(function(a){ block(a.toUpperCase(), {indent:0, align:'center'}); });
  y = 110;
  block(tituloTxt, {indent:0, align:'center'});
  y += LH*2;
  var nx = ML + 80, nw = W - 80;
  if (has(M.natureza)) para(M.natureza, {size:10, lh:L10, indent:0, align:'justify', x:nx, width:nw});
  if (has(M.orientador)){ y += L10; block('Orientador(a): ' + clean(M.orientador), {size:10, lh:L10, indent:0, align:'left', x:nx, width:nw}); }
  y = PH - MB - LH*2;
  block(clean(M.cidade || ''), {indent:0, align:'center'});
  block(clean(M.ano || ''), {indent:0, align:'center'});

  // ---------- SUMÁRIO (preenchido no fim) ----------
  newPage(); var tocPage = doc.getNumberOfPages();

  // ---------- TEXTO ----------
  newPage(); var firstText = doc.getNumberOfPages();
  var I = S.intro||{}, D = S.diag||{}, O = S.obj||{}, Fu = S.fund||{}, Me = S.metodo||{}, C = S.crono||{}, R = S.recursos||{}, Mo = S.monit||{}, Rf = S.refs||{};

  if (has(I.contexto) || has(I.justificativa)){
    h1('Introdução');
    para(I.contexto);
    if (has(I.justificativa)){ h2('Justificativa'); para(I.justificativa); }
  }
  if (has(D.problema) || has(D.dados)){
    h1('Diagnóstico situacional');
    if (has(D.problema)){ h2('Problema central'); para(D.problema); }
    if (has(D.dados)){ h2('Identificação do problema e linha de base'); para(D.dados); }
  }
  var esp = paras(O.especificos);
  if (has(O.geral) || esp.length){
    h1('Objetivos');
    if (has(O.geral)){ h2('Objetivo geral'); para(O.geral); }
    if (esp.length){
      h2('Objetivos específicos');
      esp.forEach(function(e, i){
        var t = e.replace(/[;.,\s]+$/, '');
        t = t.charAt(0).toLowerCase() + t.slice(1);
        block(String.fromCharCode(97 + (i % 26)) + ') ' + t + (i === esp.length-1 ? '.' : ';'), {indent:12.5});
      });
    }
  }
  if (has(Fu.texto)){ h1('Fundamentação teórica'); para(Fu.texto); }

  var acoes = (Me.acoes||[]).filter(function(a){ return ['oque','porque','onde','quando','quem','como','quanto'].some(function(k){return has(a[k]);}); });
  if (has(Me.texto) || acoes.length){
    h1('Metodologia');
    para(Me.texto);
    if (acoes.length){
      h2('Plano de ação (5W2H)');
      block('O Quadro ' + (nQuadro+1) + ' apresenta o plano de ação da intervenção, organizado segundo a ferramenta 5W2H.', {});
      quadro('Plano de ação da intervenção (5W2H)',
        ['O quê','Por quê','Onde','Quando','Quem','Como','Quanto'],
        acoes.map(function(a){ return ['oque','porque','onde','quando','quem','como','quanto'].map(function(k){ return clean(a[k]); }); }));
    }
  }

  var fases = (C.fases||[]).filter(function(f){ return has(f.atividade); });
  if (fases.length || has(C.obs)){
    h1('Cronograma');
    if (fases.length){
      var N = 1;
      fases.forEach(function(f){ N = Math.max(N, +f.fim || 0, +f.ini || 0); });
      N = Math.min(N, 18);
      var labels = [], ini = /^(\d{4})-(\d{2})$/.exec(C.inicio || '');
      for (var i=0;i<N;i++){
        if (ini){ var mm = (+ini[2]-1+i), yy = +ini[1] + Math.floor(mm/12); labels.push(MESES[mm%12] + '/' + String(yy).slice(2)); }
        else labels.push('M' + (i+1));
      }
      var faseNome = {'1':'Planejamento', '2':'Execução', '3':'Avaliação'};
      var body = fases.map(function(f){
        var a = Math.max(1, +f.ini || 1), b = Math.max(a, +f.fim || a), row = [clean(f.atividade), faseNome[f.fase] || ''];
        for (var i=1;i<=N;i++) row.push(i>=a && i<=b ? 'X' : '');
        return row;
      });
      var mw = Math.max(6, Math.min(10, (W - 70) / N));
      var cs = {1:{cellWidth:22}};
      for (var j=0;j<N;j++) cs[j+2] = {cellWidth:mw, halign:'center', fontSize:N>12?7:8};
      block('O Quadro ' + (nQuadro+1) + ' apresenta a distribuição das atividades ao longo dos ' + N + ' meses previstos para a intervenção.', {});
      quadro('Cronograma de execução da intervenção', ['Atividade','Fase'].concat(labels), body, cs);
    }
    para(C.obs);
  }

  if (has(R.humanos) || has(R.materiais) || has(R.financeiro)){
    h1('Recursos e orçamento');
    if (has(R.humanos)){ h2('Recursos humanos'); para(R.humanos); }
    if (has(R.materiais)){ h2('Recursos materiais'); para(R.materiais); }
    if (has(R.financeiro)){ h2('Recursos financeiros'); para(R.financeiro); }
  }

  var inds = (Mo.indicadores||[]).filter(function(a){ return has(a.nome); });
  if (has(Mo.texto) || inds.length || has(Mo.registro)){
    h1('Monitoramento e avaliação');
    para(Mo.texto);
    if (inds.length){
      h2('Indicadores');
      block('O Quadro ' + (nQuadro+1) + ' reúne os indicadores que serão utilizados no monitoramento e na avaliação da intervenção.', {});
      quadro('Indicadores de monitoramento e avaliação',
        ['Tipo','Indicador','Cálculo / fonte','Linha de base','Meta','Frequência'],
        inds.map(function(a){ return [clean(a.tipo), clean(a.nome), clean(a.calculo), clean(a.base), clean(a.meta), clean(a.freq)]; }),
        {0:{cellWidth:20}});
    }
    if (has(Mo.registro)){ h2('Registro e proteção dos dados'); para(Mo.registro); }
  }

  var refs = paras(Rf.texto);
  if (refs.length){
    if (Rf.ordenar !== false){
      refs.sort(function(a,b){ return a.replace(/\*/g,'').localeCompare(b.replace(/\*/g,''), 'pt', {sensitivity:'base'}); });
    }
    newPage();
    hUnnum('Referências');
    refs.forEach(function(r, i){
      var o = {lh:LS, indent:0, align:'left'};
      var lay = layout(r, Object.assign({size:12, base:'normal', width:W}, o));
      if (y + lay.lines.length*LS > PH - MB && lay.lines.length*LS < PH-MT-MB) newPage();
      block(r, o);
      if (i < refs.length-1) y += LS;
    });
  }

  // ---------- preencher sumário ----------
  doc.setPage(tocPage); y = MT;
  block('SUMÁRIO', {indent:0, align:'center', base:'bold'}); y += LH;
  toc.forEach(function(t){
    var st = (t.lvl === 2) ? 'normal' : 'bold';
    var num = String(t.page - 1);
    setF(st, 12);
    var maxW = W - 18, label = t.label;
    while (doc.getTextWidth(label) > maxW && label.length > 4) label = label.slice(0, -2);
    if (label !== t.label) label = label.replace(/\s*\S*$/, '') + '...';
    var yb = y + LH*0.72;
    doc.text(label, ML, yb);
    var x0 = ML + doc.getTextWidth(label) + 1.5;
    setF('normal', 12);
    var x1 = PW - MR - doc.getTextWidth(num) - 1.5, dw = doc.getTextWidth('.');
    var dots = Math.max(0, Math.floor((x1 - x0)/dw));
    if (dots) doc.text(new Array(dots+1).join('.'), x1 - dots*dw, yb);
    setF(st, 12); doc.text(num, PW - MR, yb, {align:'right'});
    y += LH;
  });

  // ---------- paginação (conta a partir da folha de rosto; exibe a partir da Introdução) ----------
  var total = doc.getNumberOfPages();
  for (var p = firstText; p <= total; p++){
    doc.setPage(p); setF('normal', 10);
    doc.text(String(p - 1), PW - MR, 20, {align:'right'});
  }
  doc.setProperties({title: clean(M.titulo || 'Projeto de intervenção'), author: autores.join('; '), subject:'Projeto de intervenção em saúde'});
  return doc;
}


/* ======================= FREQUÊNCIA ELETRÔNICA ======================= */
const FQ = { aba:'registrar', mes:null, dados:null, painel:null, pos:null, posErro:'', buscando:false, detalhe:null, filtro:'', offset:0 };
const FQ_NOME_ATIV = {consultorio:'Consultório',acolhimento:'Acolhimento',domiciliar:'Atendimento domiciliar',vigilancia:'Vigilância',gestao:'Gestão local',coletiva:'Atividade coletiva / grupo',canal:'Canal teórico',canal_nucleo:'Canal de núcleo',aula:'Aula',reuniao:'Reunião de equipe',feedback:'Feedback semanal',tcr:'TCR',estendido:'Turno estendido',sombra:'Sombra',interconsulta:'Interconsulta',reun_prec:'Reunião de preceptores',pi:'Preceptoria / PI',revisao:'Revisão de prontuário',fb_sup:'Feedback com a supervisão',vacina:'Sala de vacina',reun_enf:'Reunião de enfermagem',outro:'Outra atividade',intervalo:'Intervalo',ausente:'Fora do horário',vazio:'—'};
const FQ_EXTERNAS = ['domiciliar','aula','coletiva'];
const FQ_MOTIVOS = ['Visita / atendimento domiciliar','Atividade no território','Aula ou canal fora da unidade','Reunião externa','GPS impreciso dentro da unidade','Outro'];
const FQ_SEM = ['ausente','intervalo','vazio'];
const FQ_DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

function fqGestao(){ return GESTAO.indexOf(S.eu.perfil)>-1; }
function fqAgora(){ return new Date(Date.now()+FQ.offset); }
function fqIso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fqHoje(){ return fqIso(fqAgora()); }
function fqHM(q){ return String(q||'').slice(11,16); }
function fqData(q){ return String(q||'').slice(0,10); }
function fqMin(q){ const p=String(q).split(/[- :]/).map(Number); return new Date(p[0],p[1]-1,p[2],p[3]||0,p[4]||0,p[5]||0).getTime()/60000; }
function fqH(min){ const s=min<0?'-':''; min=Math.abs(Math.round(min)); return s+Math.floor(min/60)+'h'+pad(min%60); }
function fqDist(m){ m=Number(m)||0; return m>=1000 ? (m/1000).toFixed(1).replace('.',',')+' km' : m+' m'; }
function fqMapa(lat,lng){ return 'https://www.google.com/maps?q='+Number(lat).toFixed(6)+','+Number(lng).toFixed(6); }
function fqDistM(a,b,c,d){ const R=6371000, r=x=>x*Math.PI/180, h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))); }
function fqFeriado(iso, feriados){ return (feriados||[]).find(f=>f.data===iso); }
/** Plano do dia a partir da grade da escala (12 horários 07h–19h x seg–sex). */
function fqPlano(grade, iso, feriados){
  const w=new Date(iso+'T12:00:00').getDay(); if(w<1||w>5||!grade) return null;
  if(fqFeriado(iso,feriados)) return {ini:0,fim:0,h:0,a:[],feriado:fqFeriado(iso,feriados).nome};
  const a=grade.map(l=>(l[w-1]||{}).a||'vazio'), on=a.map((x,i)=>FQ_SEM.indexOf(x)===-1?i:-1).filter(i=>i>-1);
  return on.length ? {ini:7+on[0], fim:8+on[on.length-1], h:on.length, a:a} : {ini:0,fim:0,h:0,a:a};
}
function fqAtivAgora(grade, feriados){ const d=fqAgora(), pl=fqPlano(grade,fqIso(d),feriados); if(!pl||!pl.a.length) return null; const s=d.getHours()-7; return s>=0&&s<12 ? pl.a[s] : null; }
function fqDiasMes(mes){ const [a,m]=mes.split('-').map(Number), out=[], h=fqHoje(); for(let d=new Date(a,m-1,1); d.getMonth()===m-1; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w>0&&w<6&&fqIso(d)<=h) out.push(fqIso(d)); } return out; }
function fqResumoDia(regsPessoa, grade, iso, cfg, feriados){
  const pl=fqPlano(grade,iso,feriados), rs=regsPessoa.filter(r=>fqData(r.quando)===iso && r.situacao!=='excluido').sort((a,b)=>a.quando.localeCompare(b.quando)), h=fqHoje();
  let min=0, aberta=null; const flags=[];
  const desc=(t0,t1)=>{ let m=0; if(pl&&pl.a) pl.a.forEach((a,i)=>{ if(a!=='intervalo') return; const i0=fqMin(iso+' '+pad(7+i)+':00:00'), i1=i0+60; m+=Math.max(0,Math.min(t1,i1)-Math.max(t0,i0)); }); return m; };
  rs.forEach(r=>{ if(r.tipo==='entrada'){ if(!aberta) aberta=r; } else if(aberta){ const a=fqMin(aberta.quando), b=fqMin(r.quando); min+=b-a-desc(a,b); aberta=null; } });
  const prev=pl&&pl.h?pl.h*60:0, ent=rs.find(r=>r.tipo==='entrada'), sai=[...rs].reverse().find(r=>r.tipo==='saida');
  if(pl&&pl.feriado) flags.push(['info',pl.feriado]);
  if(prev && !rs.length && iso<h) flags.push(['err','Sem registro']);
  if(prev && !rs.length && iso===h){ const agMin=fqAgora().getHours()*60+fqAgora().getMinutes(); if(agMin>=pl.fim*60) flags.push(['err','Sem registro']); else if(agMin>pl.ini*60+cfg.tolAtraso) flags.push(['warn','Ainda sem entrada']); }
  if(ent && prev){ const atr=fqMin(ent.quando)-fqMin(iso+' '+pad(pl.ini)+':00:00'); if(atr>cfg.tolAtraso) flags.push(['warn','Atraso '+Math.round(atr)+' min']); }
  if(aberta && iso<h) flags.push(['err','Saída não registrada']);
  const fora=rs.filter(r=>!r.dentro).length; if(fora) flags.push(['warn','Fora do raio ('+fora+')']);
  if(rs.some(r=>r.origem==='manual')) flags.push(['info','Registro manual']);
  return {pl, rs, min, prev, ent, sai, aberta, flags};
}
function fqResumoMes(regsPessoa, grade, mes, cfg, feriados){
  const r={dias:0,min:0,prev:0,atrasos:0,semSaida:0,fora:0,faltas:0}; const h=fqHoje();
  fqDiasMes(mes).forEach(iso=>{ const x=fqResumoDia(regsPessoa,grade,iso,cfg,feriados);
    if(x.rs.length) r.dias++; r.min+=x.min; if(iso<h) r.prev+=x.prev;
    x.flags.forEach(f=>{ if(/^Atraso/.test(f[1])) r.atrasos++; if(f[1]==='Saída não registrada') r.semSaida++; if(f[1]==='Sem registro') r.faltas++; });
    r.fora+=x.rs.filter(z=>!z.dentro).length; });
  return r;
}
function fqSelo(r, cfg){
  if(r.origem==='manual') return '<span class="fq-chip st-info">Manual</span>';
  if(!r.dentro) return '<span class="fq-chip st-warn">Fora · '+fqDist(r.distancia)+'</span>';
  if(r.precisao>cfg.precMax) return '<span class="fq-chip st-warn">GPS ±'+r.precisao+' m</span>';
  return '<span class="fq-chip st-ok">Na unidade</span>';
}
function fqFlags(fs){ return fs.length ? fs.map(f=>'<span class="fq-chip st-'+f[0]+'">'+esc(f[1])+'</span>').join(' ') : '<span class="fq-chip st-ok">Regular</span>'; }

async function vFrequencia(){
  FQ.mes = FQ.mes || mesAtual();
  view('<div class="pg-head"><div><h1>Frequência</h1><p class="mut sm">Registro de entrada e saída com localização no momento do registro.</p></div></div>'+
    '<div class="tabs2 fq-tabs" id="fqTabs"></div><div id="fqBox" style="margin-top:14px"><div class="card vazio">Carregando…</div></div>');
  fqPintarAbas();
  await fqCarregar();
}
function fqPintarAbas(){
  const a=[['registrar','Registrar'],['historico','Meu histórico']]; if(fqGestao()) a.push(['painel','Painel'],['config','Configurar']);
  if(S.eu.perfil==='admin') a.splice(0,2);
  if(!a.some(x=>x[0]===FQ.aba)) FQ.aba=a[0][0];
  const t=$('#fqTabs'); if(t) t.innerHTML=a.map(x=>'<button class="'+(x[0]===FQ.aba?'on':'')+'" onclick="fqIr(\''+x[0]+'\')">'+x[1]+'</button>').join('');
}
async function fqIr(a){ FQ.aba=a; FQ.detalhe=null; fqPintarAbas(); await fqCarregar(); }
async function fqCarregar(){
  try{
    if(FQ.aba==='registrar' || FQ.aba==='historico'){
      const r=await call('freqInicio',{mes:FQ.mes});
      FQ.dados=r; FQ.offset=fqMin(r.agora)*60000-Date.now();
    } else {
      const r=await call('freqPainel',{mes:FQ.mes});
      FQ.painel=r; FQ.dados=FQ.dados||{cfg:r.cfg}; FQ.offset=fqMin(r.agora)*60000-Date.now();
    }
  }catch(e){ const b=$('#fqBox'); if(b) b.innerHTML='<div class="card vazio">Não foi possível carregar: '+esc(msgErro(e))+'</div>'; return; }
  fqRender();
  if(FQ.aba==='registrar' && !FQ.buscando) fqLerLocal();
}
function fqRender(){
  const b=$('#fqBox'); if(!b || S.rota!=='frequencia') return;
  if(FQ.aba==='registrar') b.innerHTML=fqTelaRegistrar();
  else if(FQ.aba==='historico') b.innerHTML=fqTelaHistorico(S.eu, FQ.dados.meus, FQ.dados.grade, false);
  else if(FQ.aba==='painel') b.innerHTML= FQ.detalhe ? fqTelaDetalhe() : fqTelaPainel();
  else b.innerHTML=fqTelaConfig();
}

/* ----- localização ----- */
function fqPosicao(){
  return new Promise((ok,falha)=>{
    if(!navigator.geolocation) return falha(new Error('Este aparelho ou navegador não oferece localização.'));
    navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),em:Date.now()}),
      e=>falha(new Error(e.code===1?'Permissão de localização negada. Libere a localização para a plataforma nas configurações do aparelho.':e.code===3?'O GPS demorou para responder. Vá para perto de uma janela e tente de novo.':'Não foi possível obter a localização.')),
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}
function fqAvaliar(g){ const c=FQ.dados.cfg; if(!c.geo) return Object.assign(g,{dist:null,dentro:false}); const dist=fqDistM(c.geo.lat,c.geo.lng,g.lat,g.lng); return Object.assign(g,{dist:dist, dentro:dist<=c.geo.raio, impreciso:g.acc>c.precMax}); }
async function fqLerLocal(){
  FQ.buscando=true; FQ.posErro=''; fqRender();
  try{ FQ.pos=fqAvaliar(await fqPosicao()); }catch(e){ FQ.pos=null; FQ.posErro=msgErro(e); }
  FQ.buscando=false; fqRender();
}

/* ----- registrar ----- */
function fqProximo(){ const h=fqHoje(), rs=(FQ.dados.meus||[]).filter(r=>fqData(r.quando)===h).sort((a,b)=>a.quando.localeCompare(b.quando)); return rs.length && rs[rs.length-1].tipo==='entrada' ? 'saida':'entrada'; }
function fqTelaRegistrar(){
  const d=FQ.dados, c=d.cfg, agora=fqAgora(), iso=fqHoje(), pl=fqPlano(d.grade,iso,d.feriados), tipo=fqProximo(), at=fqAtivAgora(d.grade,d.feriados);
  const rs=(d.meus||[]).filter(r=>fqData(r.quando)===iso).sort((a,b)=>a.quando.localeCompare(b.quando));
  let loc;
  if(!c.geo) loc='<div class="fq-loc erro"><b>Localização da unidade não configurada</b><small>A supervisão precisa definir o ponto da UBS em Frequência › Configurar.</small></div>';
  else if(FQ.buscando) loc='<div class="fq-loc"><span class="fq-pulse"></span><div><b>Obtendo localização…</b><small>Mantenha esta tela aberta.</small></div></div>';
  else if(FQ.posErro) loc='<div class="fq-loc erro"><b>Localização indisponível</b><small>'+esc(FQ.posErro)+'</small></div>';
  else if(FQ.pos) loc='<div class="fq-loc '+(FQ.pos.dentro&&!FQ.pos.impreciso?'ok':'fora')+'"><div><b>'+(FQ.pos.dentro?(FQ.pos.impreciso?'Dentro do raio, GPS impreciso':'Você está na unidade'):'Fora do raio da unidade')+'</b><small>'+fqDist(FQ.pos.dist)+' de '+esc(c.unidade)+' · precisão ±'+FQ.pos.acc+' m</small></div><a href="'+fqMapa(FQ.pos.lat,FQ.pos.lng)+'" target="_blank" rel="noopener" class="sm">Ver no mapa</a></div>';
  else loc='<div class="fq-loc"><b>Localização ainda não lida</b></div>';
  return '<div class="fq-grid"><div class="card fq-reg">'+
    '<div class="fq-relogio"><span id="fqHora">'+pad(agora.getHours())+':'+pad(agora.getMinutes())+'</span><small>'+FQ_DIAS[agora.getDay()]+', '+dataBr(iso)+'</small></div>'+loc+
    '<button class="fq-bater '+tipo+'" id="fqBt" onclick="fqRegistrar()"'+(FQ.buscando||!c.geo?' disabled':'')+'>Registrar '+(tipo==='entrada'?'entrada':'saída')+'</button>'+
    '<button class="btn" onclick="fqLerLocal()"'+(FQ.buscando?' disabled':'')+'>Atualizar localização</button></div>'+
    '<div class="card"><h2 style="margin-top:0">Hoje</h2>'+
    (pl&&pl.feriado?'<p class="sm">Feriado: <b>'+esc(pl.feriado)+'</b></p>':pl&&pl.h?'<p class="sm">Previsto na escala: <b>'+pad(pl.ini)+':00 às '+pad(pl.fim)+':00</b> ('+pl.h+'h de atividade)'+(at?'<br>Agora: <b>'+esc(FQ_NOME_ATIV[at]||at)+'</b>':'')+'</p>':'<p class="mut sm">'+(d.grade?'Sem atividade prevista na escala para hoje.':'Sua escala ainda não foi cadastrada na plataforma.')+'</p>')+
    (rs.length?'<ul class="fq-linha">'+rs.map(r=>'<li><span class="fq-tp '+r.tipo+'">'+(r.tipo==='entrada'?'Entrada':'Saída')+'</span><b>'+fqHM(r.quando)+'</b>'+fqSelo(r,c)+(r.justificativa?'<small>'+esc(r.justificativa)+'</small>':'')+'</li>').join('')+'</ul>':'<p class="mut sm">Nenhum registro hoje.</p>')+
    '<p class="mut sm" style="margin-bottom:0">O horário registrado é o do servidor da plataforma. A localização é lida só no momento do registro.</p></div></div>';
}
async function fqRegistrar(just){
  if(!FQ.dados.termo) return fqTermo();
  const bt=$('#fqBt'); if(bt) bt.disabled=true;
  let g;
  try{ FQ.buscando=true; fqRender(); g=fqAvaliar(await fqPosicao()); FQ.pos=g; }
  catch(e){ FQ.buscando=false; FQ.posErro=msgErro(e); fqRender(); toast(msgErro(e),'err'); return; }
  FQ.buscando=false; fqRender();
  if((!g.dentro || g.impreciso) && just===undefined){
    if(!g.dentro && FQ.dados.cfg.regraFora==='bloquear'){ abrirModal('<h2>Registro não permitido</h2><p>Você está a <b>'+fqDist(g.dist)+'</b> da unidade e a regra atual bloqueia registros fora do raio de '+FQ.dados.cfg.geo.raio+' m.</p><p class="mut sm">Em atividade externa, peça à supervisão um registro manual.</p><div class="m-acoes"><button class="btn pri" onclick="fecharModal()">Entendi</button></div>'); return; }
    return fqJustificar(g);
  }
  try{
    const r=await call('freqRegistrar',{lat:g.lat,lng:g.lng,precisao:g.acc,justificativa:just||'',dispositivo:navigator.userAgent.slice(0,110)},true);
    FQ.dados.meus.push(r); fecharModal(); fqRender();
    toast((r.tipo==='entrada'?'Entrada':'Saída')+' registrada às '+fqHM(r.quando)+(r.dentro?'':' (fora do raio)'),'ok');
  }catch(e){
    const m=msgErro(e);
    if(m==='TERMO') return fqTermo();
    if(m==='JUSTIFICAR') return fqJustificar(g);
    toast(m,'err');
  }
}
function fqJustificar(g){
  const at=fqAtivAgora(FQ.dados.grade,FQ.dados.feriados), ext=at&&FQ_EXTERNAS.indexOf(at)>-1;
  let sel=!g.dentro ? (at==='domiciliar'?FQ_MOTIVOS[0]:ext?FQ_MOTIVOS[1]:'') : FQ_MOTIVOS[4];
  abrirModal('<h2>'+(g.dentro?'Precisão do GPS baixa':'Você está fora do raio da unidade')+'</h2>'+
    '<p class="sm">Distância: <b>'+fqDist(g.dist)+'</b> · precisão ±'+g.acc+' m · raio permitido '+FQ.dados.cfg.geo.raio+' m.</p>'+
    (at?'<p class="sm">Atividade prevista na sua escala agora: <b>'+esc(FQ_NOME_ATIV[at]||at)+'</b>'+(ext?' (registro externo esperado).':'.')+'</p>':'')+
    '<div class="fld"><span class="lbl">Motivo <span class="req">*</span></span><div class="chips" id="fqMot">'+FQ_MOTIVOS.map(m=>'<button type="button" class="chip-bt'+(m===sel?' on':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</button>').join('')+'</div></div>'+
    '<div class="fld"><label class="lbl" for="fqJ">Detalhe <span class="mut" id="fqJo">(opcional)</span></label><input type="text" id="fqJ" maxlength="200" placeholder="Ex.: VD família Silva, microárea 4"></div>'+
    '<div class="m-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="fqJok">Registrar com justificativa</button></div>');
  const obr=()=>{ $('#fqJo').textContent= sel==='Outro'?'(obrigatório)':'(opcional)'; };
  $$('#fqMot .chip-bt').forEach(b=>b.onclick=()=>{ sel=b.dataset.m; $$('#fqMot .chip-bt').forEach(x=>x.classList.toggle('on',x===b)); obr(); }); obr();
  $('#fqJok').onclick=async()=>{ const t=$('#fqJ').value.trim(); if(!sel) return toast('Escolha o motivo.','err'); if(sel==='Outro'&&!t) return toast('Descreva o motivo.','err');
    $('#fqJok').disabled=true; fecharModal(); await fqRegistrar(sel+(t?' — '+t:'')); };
}
function fqTermo(){
  abrirModal('<h2>Termo de ciência — uso da localização</h2>'+
    '<p class="sm">Ao registrar entrada e saída na plataforma, a sua localização é capturada <b>somente no momento do registro</b>, nunca de forma contínua.</p>'+
    '<ul class="sm"><li>Finalidade: comprovar a frequência na unidade e nas atividades do território do '+esc(S.programa)+'.</li>'+
    '<li>Quem vê o local exato: supervisão de preceptoria, gestão da unidade e administração da plataforma.</li>'+
    '<li>O registro não substitui o ponto oficial dos servidores, salvo definição da SEMS.</li>'+
    '<li>Você pode consultar todos os seus registros em “Meu histórico”.</li></ul>'+
    '<div class="m-acoes"><button class="btn" onclick="fecharModal()">Agora não</button><button class="btn pri" id="fqTok">Li e concordo</button></div>');
  $('#fqTok').onclick=async()=>{ try{ FQ.dados.termo=await call('freqTermo',{}); fecharModal(); fqRegistrar(); }catch(e){} };
}

/* ----- histórico ----- */
function fqTelaHistorico(p, regs, grade, gestao){
  const cfg=(FQ.painel&&gestao?FQ.painel.cfg:FQ.dados.cfg), fer=(gestao?FQ.painel.feriados:FQ.dados.feriados);
  const R=fqResumoMes(regs,grade,FQ.mes,cfg,fer), dias=fqDiasMes(FQ.mes).reverse(), saldo=R.min-R.prev;
  return '<div class="ul" style="margin-bottom:10px"><div>'+(gestao?'<button class="btn sm" onclick="FQ.detalhe=null;fqRender()">← Voltar ao painel</button><h2>'+esc(p.nome)+'</h2><p class="mut sm" style="margin:0">'+esc(PERFIL_NOME[p.perfil]||'')+(p.categoria?' · '+esc(p.categoria):'')+(p.ano?' · '+esc(p.ano):'')+'</p>':'')+'</div>'+
    '<div class="bts"><input type="month" value="'+FQ.mes+'" onchange="FQ.mes=this.value||FQ.mes;fqCarregar()">'+(gestao?'<button class="btn sm pri" onclick="fqManual(\''+p.id+'\')">Registro manual</button>':'')+'</div></div>'+
    (grade?'':'<div class="alerta">'+(gestao?'Esta pessoa':'Você')+' ainda não tem escala cadastrada: as horas previstas ficam zeradas.</div>')+
    '<div class="grid g4"><div class="kpi"><span>Horas registradas</span><b>'+fqH(R.min)+'</b></div><div class="kpi"><span>Previstas (dias encerrados)</span><b>'+fqH(R.prev)+'</b></div>'+
    '<div class="kpi"><span>Saldo</span><b style="color:'+(saldo<-60?'var(--err)':saldo>60?'var(--ok)':'inherit')+'">'+fqH(saldo)+'</b></div><div class="kpi"><span>Pendências</span><b>'+(R.faltas+R.semSaida)+'</b><small class="mut">'+R.faltas+' sem registro · '+R.semSaida+' sem saída</small></div></div>'+
    '<div class="card" style="padding:0;margin-top:12px"><div class="tab-wrap"><table class="fq-tab"><thead><tr><th>Dia</th><th>Previsto</th><th>Registros</th><th>Horas</th><th>Situação</th></tr></thead><tbody>'+
    (dias.length?dias.map(iso=>{ const x=fqResumoDia(regs,grade,iso,cfg,fer), w=new Date(iso+'T12:00:00').getDay();
      return '<tr><td class="nw"><b>'+dataBr(iso).slice(0,5)+'</b> <small class="mut">'+FQ_DIAS[w].slice(0,3)+'</small></td>'+
        '<td class="nw">'+(x.pl&&x.pl.h?pad(x.pl.ini)+'h–'+pad(x.pl.fim)+'h <small class="mut">('+x.pl.h+'h)</small>':'<span class="mut">—</span>')+'</td><td>'+
        (x.rs.length?x.rs.map(r=>'<div class="fq-rg"><span class="fq-tp '+r.tipo+'">'+(r.tipo==='entrada'?'E':'S')+'</span> '+fqHM(r.quando)+' '+fqSelo(r,cfg)+
          (gestao&&r.origem!=='manual'&&r.lat?' <a class="sm" href="'+fqMapa(r.lat,r.lng)+'" target="_blank" rel="noopener">mapa</a>':'')+
          (gestao?' <button class="x" title="Excluir registro" onclick="fqExcluir(\''+r.id+'\')">×</button>':'')+
          (r.justificativa?'<small class="mut d">'+esc(r.justificativa)+(r.origem==='manual'&&r.registrado_por?' · por '+esc(nomeU(r.registrado_por)||'supervisão'):'')+'</small>':'')+'</div>').join(''):'<span class="mut">—</span>')+
        '</td><td class="nw">'+(x.min?fqH(x.min):'—')+'</td><td>'+fqFlags(x.flags)+'</td></tr>'; }).join(''):'<tr><td colspan="5" class="mut">Sem dias úteis neste mês até hoje.</td></tr>')+
    '</tbody></table></div></div>';
}

/* ----- painel ----- */
function fqRegsDe(id){ return FQ.painel.registros.filter(r=>r.usuario_id===id); }
function fqTelaPainel(){
  const P=FQ.painel, iso=fqHoje(), lista=P.pessoas.filter(p=>!FQ.filtro || p.perfil===FQ.filtro);
  const hoje=lista.map(p=>({p, x:fqResumoDia(fqRegsDe(p.id),P.grades[p.id],iso,P.cfg,P.feriados)}));
  const presentes=hoje.filter(o=>o.x.aberta).length, semEnt=hoje.filter(o=>o.x.flags.some(f=>f[1]==='Ainda sem entrada')).length, fora=hoje.filter(o=>o.x.rs.some(r=>!r.dentro)).length;
  const comPrev=hoje.filter(o=>o.x.prev).length, registraram=hoje.filter(o=>o.x.rs.length).length;
  const semEscala=P.pessoas.filter(p=>!P.grades[p.id]).length;
  const linhaHoje=o=>{ const x=o.x; return '<tr class="click" onclick="fqVer(\''+o.p.id+'\')"><td><b>'+esc(o.p.nome)+'</b><br><small class="mut">'+esc(o.p.categoria||PERFIL_NOME[o.p.perfil]||'')+(o.p.ano?' · '+esc(o.p.ano):'')+'</small></td>'+
    '<td class="nw">'+(x.pl&&x.pl.h?pad(x.pl.ini)+'h–'+pad(x.pl.fim)+'h':'—')+'</td><td class="nw">'+(x.ent?fqHM(x.ent.quando)+' '+fqSelo(x.ent,P.cfg):'—')+'</td>'+
    '<td class="nw">'+(x.aberta?'<span class="fq-chip st-ok">Em atividade</span>':x.sai?fqHM(x.sai.quando):'—')+'</td><td>'+fqFlags(x.flags)+'</td></tr>'; };
  return '<div class="ul" style="margin-bottom:10px"><p class="mut sm" style="margin:0">'+esc(P.unidade)+' · atualizado às '+fqHM(P.agora)+'</p>'+
    '<div class="bts"><select onchange="FQ.filtro=this.value;fqRender()"><option value="">Todos</option>'+['residente','preceptor','supervisor','gestor','colaborador'].map(t=>'<option value="'+t+'"'+(FQ.filtro===t?' selected':'')+'>'+esc(PERFIL_NOME[t])+'</option>').join('')+'</select><button class="btn sm" onclick="fqCarregar()">Atualizar</button></div></div>'+
    (semEscala?'<div class="alerta">'+semEscala+' pessoa(s) sem escala cadastrada: para elas, a plataforma não calcula horas previstas nem atrasos.</div>':'')+
    '<div class="grid g4"><div class="kpi"><span>Em atividade agora</span><b>'+presentes+'</b></div><div class="kpi"><span>Esperados sem entrada</span><b style="color:'+(semEnt?'var(--warn)':'inherit')+'">'+semEnt+'</b></div>'+
    '<div class="kpi"><span>Fora do raio hoje</span><b>'+fora+'</b></div><div class="kpi"><span>Registraram hoje</span><b>'+registraram+' de '+comPrev+'</b><small class="mut">com atividade prevista</small></div></div>'+
    '<h3 class="sec-t">Hoje</h3><div class="card" style="padding:0"><div class="tab-wrap"><table class="fq-tab"><thead><tr><th>Pessoa</th><th>Previsto</th><th>Entrada</th><th>Saída</th><th>Situação</th></tr></thead><tbody>'+
    (hoje.filter(o=>o.x.prev||o.x.rs.length).sort((a,b)=>(b.x.flags.length-a.x.flags.length)||a.p.nome.localeCompare(b.p.nome)).map(linhaHoje).join('')||'<tr><td colspan="5" class="mut">Ninguém com atividade prevista ou registro hoje.</td></tr>')+'</tbody></table></div></div>'+
    '<div class="ul"><h3 class="sec-t">Consolidado do mês</h3><div class="bts"><input type="month" value="'+FQ.mes+'" onchange="FQ.mes=this.value||FQ.mes;fqCarregar()"><button class="btn sm" onclick="fqCSV()">Exportar planilha (CSV)</button></div></div>'+
    '<div class="card" style="padding:0"><div class="tab-wrap"><table class="fq-tab"><thead><tr><th>Pessoa</th><th>Dias</th><th>Horas</th><th>Previstas</th><th>Cumprido</th><th>Atrasos</th><th>Sem saída</th><th>Sem registro</th><th>Fora do raio</th></tr></thead><tbody>'+
    lista.map(p=>{ const r=fqResumoMes(fqRegsDe(p.id),P.grades[p.id],FQ.mes,P.cfg,P.feriados), pc=r.prev?Math.round(100*r.min/r.prev):0;
      return '<tr class="click" onclick="fqVer(\''+p.id+'\')"><td><b>'+esc(p.nome.split(' ')[0])+'</b> <small class="mut">'+esc(p.categoria||'')+'</small></td><td>'+r.dias+'</td><td class="nw">'+fqH(r.min)+'</td><td class="nw">'+(P.grades[p.id]?fqH(r.prev):'<span class="mut">sem escala</span>')+'</td>'+
        '<td>'+(r.prev?barra(Math.min(pc,100))+'<small>'+pc+'%</small>':'—')+'</td><td>'+(r.atrasos||'–')+'</td><td style="color:'+(r.semSaida?'var(--err)':'inherit')+'">'+(r.semSaida||'–')+'</td><td style="color:'+(r.faltas?'var(--err)':'inherit')+'">'+(r.faltas||'–')+'</td><td>'+(r.fora||'–')+'</td></tr>'; }).join('')+
    '</tbody></table></div></div><p class="mut sm">As horas registradas descontam o intervalo previsto na escala. Previstas = horas da escala nos dias úteis já encerrados, sem feriados. Toque em uma pessoa para ver o detalhe, o mapa de cada registro e lançar registro manual.</p>';
}
function fqVer(id){ FQ.detalhe=id; fqRender(); window.scrollTo(0,0); }
function fqTelaDetalhe(){ const p=FQ.painel.pessoas.find(x=>x.id===FQ.detalhe); if(!p){ FQ.detalhe=null; return fqTelaPainel(); } return fqTelaHistorico(p, fqRegsDe(p.id), FQ.painel.grades[p.id], true); }
function fqManual(pid){
  const p=FQ.painel.pessoas.find(x=>x.id===pid);
  abrirModal('<h2>Registro manual</h2><p class="mut sm">'+esc(p.nome)+' · para esquecimentos ou falta de celular. Fica identificado como manual, com o seu nome.</p>'+
    '<div class="row2"><div class="fld"><label class="lbl" for="mqD">Data</label><input type="date" id="mqD" value="'+fqHoje()+'" max="'+fqHoje()+'"></div><div class="fld"><label class="lbl" for="mqH">Hora</label><input type="time" id="mqH" value="'+pad(fqAgora().getHours())+':'+pad(fqAgora().getMinutes())+'"></div></div>'+
    '<div class="fld"><span class="lbl">Tipo</span><div class="chips" id="mqT"><button type="button" class="chip-bt on" data-t="entrada">Entrada</button><button type="button" class="chip-bt" data-t="saida">Saída</button></div></div>'+
    '<div class="fld"><label class="lbl" for="mqM">Motivo <span class="req">*</span></label><input type="text" id="mqM" maxlength="200" placeholder="Ex.: esqueceu de registrar a saída; confirmado com a preceptora"></div>'+
    '<div class="m-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="mqOk">Salvar registro</button></div>');
  let tipo='entrada';
  $$('#mqT .chip-bt').forEach(b=>b.onclick=()=>{ tipo=b.dataset.t; $$('#mqT .chip-bt').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#mqOk').onclick=async()=>{ try{ const r=await call('freqManual',{usuario_id:pid,data:val('mqD'),hora:val('mqH'),tipo:tipo,motivo:val('mqM')});
    if(r.quando.slice(0,7)===FQ.mes) FQ.painel.registros.push(r); fecharModal(); fqRender(); toast('Registro manual salvo.','ok'); }catch(e){} };
}
function fqExcluir(id){
  abrirModal('<h2>Excluir registro</h2><p class="sm">O registro deixa de contar na frequência, mas fica guardado na planilha com o motivo e o seu nome (auditoria).</p>'+
    '<div class="fld"><label class="lbl" for="exM">Motivo <span class="req">*</span></label><input type="text" id="exM" maxlength="200" placeholder="Ex.: registro duplicado"></div>'+
    '<div class="m-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn dng" id="exOk">Excluir</button></div>');
  $('#exOk').onclick=async()=>{ try{ await call('freqExcluir',{id:id,motivo:val('exM')}); const r=FQ.painel.registros.find(x=>x.id===id); if(r) r.situacao='excluido'; fecharModal(); fqRender(); toast('Registro excluído.','ok'); }catch(e){} };
}
function fqCSV(){
  const P=FQ.painel, nome=id=>(P.pessoas.find(p=>p.id===id)||{}).nome||'';
  const L=[['Data','Hora','Pessoa','Perfil','Categoria','Tipo','Situação','Dentro do raio','Distância (m)','Precisão (m)','Latitude','Longitude','Justificativa','Origem','Observação']];
  P.registros.slice().sort((a,b)=>a.quando.localeCompare(b.quando)).forEach(r=>{ const p=P.pessoas.find(x=>x.id===r.usuario_id)||{};
    L.push([dataBr(fqData(r.quando)),fqHM(r.quando),nome(r.usuario_id),PERFIL_NOME[p.perfil]||'',p.categoria||'',r.tipo==='entrada'?'Entrada':'Saída',r.situacao==='excluido'?'Excluído':'Válido',r.dentro?'Sim':'Não',r.distancia,r.precisao,r.lat||'',r.lng||'',r.justificativa,r.origem,r.obs]); });
  const csv='﻿'+L.map(l=>l.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='frequencia-'+FQ.mes+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ----- configurar ----- */
function fqTelaConfig(){
  const c=FQ.painel.cfg, g=c.geo||{lat:'',lng:'',raio:150};
  return '<div class="card"><h2 style="margin-top:0">Ponto da unidade e cerca virtual</h2><p class="mut sm">'+esc(c.unidade)+'</p>'+
    '<div class="row2"><div class="fld"><label class="lbl" for="cfLat">Latitude</label><input type="text" inputmode="decimal" id="cfLat" value="'+g.lat+'"></div><div class="fld"><label class="lbl" for="cfLng">Longitude</label><input type="text" inputmode="decimal" id="cfLng" value="'+g.lng+'"></div></div>'+
