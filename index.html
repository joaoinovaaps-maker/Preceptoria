<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* Endereço do servidor (Apps Script). Se fizer uma nova implantação com outro endereço, troque aqui. */

var PAGINA_EXTERNA = true;
var URL_PARAMS = (function(){ var o={}; new URLSearchParams(location.search).forEach(function(v,k){ o[k]=v; }); return o; })();</script>
<meta charset="utf-8">
<title>Plataforma da Preceptoria</title>
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--tx:#1b2a28;--mut:#5d6e6b;--bd:#d9e3e0;
  --pri:#0b6e4f;--pri-d:#08573e;--pri2:#e2f1ea;
  --ok:#1f7a3d;--ok2:#e1f3e5;--warn:#a86400;--warn2:#fff2d9;--err:#b3261e;--err2:#fde8e6;--info:#1e5ea8;--info2:#e5eefa;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.3rem;margin:0}h2{font-size:1.15rem;margin:.6rem 0 .3rem}
.mut{color:var(--mut)}.sm{font-size:.85rem}.hidden{display:none!important}
.req{color:var(--err)}

/* Topo e navegação */
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:1rem}.brand small{display:block;opacity:.85;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logos{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.logos img{height:46px;max-width:130px;object-fit:contain}
.logos.esq{justify-content:flex-start;margin:0 0 10px}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:.8rem;letter-spacing:.5px}
.acts{display:flex;gap:6px}
.icon{position:relative;background:rgba(255,255,255,.14);border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#fff}
.icon svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:10px;font-size:.7rem;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:700}
.tabs{background:#fff;border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;gap:2px;padding:0 10px;position:sticky;top:58px;z-index:19}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px;white-space:nowrap;cursor:pointer;color:var(--mut);font-weight:600;font-size:.9rem}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1040px;margin:0 auto;padding:18px 16px 90px}

/* Componentes */
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pg-head p{margin:.2rem 0 0}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f6f9f8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.dng{color:var(--err);border-color:#f0c4c0}
.btn.sm{padding:6px 10px;font-size:.85rem}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:700}
.st-rascunho{background:#eef1f0;color:#55635f}.st-aguardando{background:var(--warn2);color:var(--warn)}
.st-assinado,.st-concluido{background:var(--ok2);color:var(--ok)}.st-em_andamento,.st-registrado{background:var(--info2);color:var(--info)}
.filtros{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.filtros label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.vazio{text-align:center;color:var(--mut);padding:28px 10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi span{display:block;color:var(--mut);font-size:.8rem}.kpi b{font-size:1.5rem}
.kpi small{color:var(--mut)}
.sec-t{font-size:.95rem;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}

/* Cartões de registro */
.reg.click{cursor:pointer}.reg.click:hover{border-color:var(--pri)}
.reg-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tipo{font-size:.75rem;color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.reg-tit{font-weight:700;margin:6px 0 2px}
.reg-meta{color:var(--mut);font-size:.85rem}
.alerta{margin-top:8px;background:var(--warn2);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600}

/* Barras */
.bar{height:8px;background:#e8eeec;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.c-ok{background:#2e9a52}.c-med{background:#e0a100}.c-low{background:#d9534f}
.met{margin:8px 0}.met .lin{display:flex;justify-content:space-between;font-size:.85rem}
.hbar{display:grid;grid-template-columns:minmax(110px,34%) 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:.88rem}
.hbar .bar{height:14px;margin:0}.hbar b{text-align:right}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}

/* Formulários */
.fld{margin-bottom:14px}
.lbl{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=month],input[type=email],select,textarea{width:100%;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;background:#fff}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.multi{border:1px solid var(--bd);border-radius:9px;padding:8px 10px;max-height:220px;overflow:auto}
.multi label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:.9rem}
.tab-ed{width:100%;border-collapse:collapse}
.tab-ed th{font-size:.75rem;text-align:left;color:var(--mut);padding:4px}
.tab-ed td{padding:3px;vertical-align:top}
.tab-ed textarea{min-height:44px;padding:6px 8px;font-size:.88rem}
.tab-wrap{overflow-x:auto}
.x{border:0;background:none;color:var(--err);cursor:pointer;font-size:1.1rem;padding:6px}
.esc-g{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.esc-g h4{margin:0;padding:8px 12px;background:var(--pri2);color:var(--pri-d);font-size:.88rem}
.esc-i{padding:9px 12px;border-top:1px solid var(--bd)}
.esc-i p{margin:0 0 6px;font-size:.9rem}
.esc-op{display:flex;gap:6px;flex-wrap:wrap}
.esc-op label{border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:.8rem;cursor:pointer;display:flex;gap:5px;align-items:center}
.esc-op input{margin:0}
details.etapa{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#fff}
details.etapa summary{padding:12px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
details.etapa > div,details.etapa > .fld{padding:0 14px}
details.etapa[open] summary{border-bottom:1px solid var(--bd);margin-bottom:12px}
.ok-et{color:var(--ok);font-size:.8rem}
.barra-acoes{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:15}


/* Blocos, orientações, chips */
.bloco{margin:18px 0 10px}.bloco:first-child{margin-top:0}
.blk-t{font-size:1rem;margin:0 0 6px;display:flex;gap:10px;align-items:baseline;color:var(--pri-d)}
.blk-t .n{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--pri);border:1px solid var(--pri);border-radius:6px;padding:0 6px}
.orient{background:var(--pri2);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px;line-height:1.5}
.orient code{background:#fff;border-radius:4px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;background:#fff}
.chips.col .chip{border-radius:8px}
.chip input{accent-color:var(--pri);margin:0}
.chip:has(input:checked){border-color:var(--pri);background:var(--pri2);color:var(--pri-d);font-weight:600}
.chip-bt{border:1px dashed var(--bd);background:#f6f9f8;border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:var(--tx)}
.chip-bt:hover{border-color:var(--pri)}
.chip-bt.on{background:var(--pri);border:1px solid var(--pri);color:#fff}
/* Escala */
.esc-g h4 small{font-weight:400;color:var(--mut)}
.esc-i .ev{display:block;font-size:.76rem;color:var(--mut);font-style:italic;margin-top:2px}
.esc-i .cod{font-family:ui-monospace,Consolas,monospace;color:var(--pri);margin-right:4px}
.esc-op label{padding:0;border:0}
.esc-op span{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:4px 11px;font-size:.82rem;cursor:pointer;background:#fff}
.esc-op input{position:absolute;opacity:0;pointer-events:none}
.esc-op input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.esc-op input[value="0"]:checked+span,.esc-op input[value="n"]:checked+span{background:var(--err);border-color:var(--err)}
.esc-op input[value="1"]:checked+span,.esc-op input[value="p"]:checked+span{background:var(--warn);border-color:var(--warn)}
.esc-op input[value="NA"]:checked+span{background:var(--mut);border-color:var(--mut)}
.esc-op input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.esc-obs{min-height:48px}
.esc-res{font-size:.88rem;color:var(--mut);margin-top:4px}
.score.ok{background:var(--ok)}.score.warn{background:var(--warn)}.score.bad{background:var(--err)}
/* Cartões */
.cartoes{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.cartao{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fbfdfc}
.cartao-h{display:flex;justify-content:space-between;align-items:center}
.cartao-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cartao-g label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--mut);font-weight:600}
.cartao-g label.span2{grid-column:1/-1}
.cartao-g textarea{min-height:52px}
/* PDI */
.pdi-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pdi-bts{display:flex;gap:6px;flex-wrap:wrap}
.pdi-row{border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
.pdi-row .lbl{margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.tag.t-campo{background:#e3eefb;color:#2f6fb3}.tag.t-nucleo{background:#f1e7f9;color:#8a4fb5}
.tag.t-C{background:#fff;color:#1f7a5c;border:1px solid currentColor}.tag.t-H{background:#fff;color:#b0631a;border:1px solid currentColor}.tag.t-A{background:#fff;color:#a33a5a;border:1px solid currentColor}
.pdi-tab td{font-size:.84rem}
/* Matriz (modal) */
.modal-box.largo{max-width:760px}
.tabs2{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-top:10px}
.tabs2 button{flex:1;border:0;background:#fff;padding:9px 6px;font-weight:600;cursor:pointer;font-size:.88rem}
.tabs2 button.on{background:var(--pri);color:#fff}
.mz-corpo{max-height:52vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mz-dom{border:1px solid var(--bd);border-radius:9px}
.mz-dom summary{padding:10px 12px;font-weight:700;cursor:pointer}
.mz-comp{font-size:.82rem;color:var(--mut);border-left:3px solid var(--bd);margin:0 12px 8px;padding-left:8px}
.mz-dom .grp{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:8px 12px 2px}
.grp.t-C{color:#1f7a5c}.grp.t-H{color:#b0631a}.grp.t-A{color:#a33a5a}
.mz-item{display:flex;gap:8px;align-items:flex-start;padding:6px 12px;font-size:.88rem;cursor:pointer}
.mz-item:hover{background:#f4f8f7}.mz-item input{margin-top:3px;accent-color:var(--pri)}
.mz-item.ja{opacity:.55}.mz-item small{color:var(--pri);font-weight:700}
.chk-l{list-style:none;padding:0;margin:0;font-size:.88rem}.chk-l li{padding:2px 0}
details.refs{margin-top:16px;font-size:.88rem}details.refs summary{cursor:pointer;font-weight:600}
details.etapa > div > .orient{margin-top:0}
@media print{.chip-bt,.pdi-bts{display:none}}


.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:520px){.faces{grid-template-columns:repeat(3,1fr)}}
.face{position:relative;display:block;cursor:pointer}
.face input{position:absolute;opacity:0;pointer-events:none}
.face span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border:2px solid var(--bd);border-radius:10px;background:#fff}
.face img{width:52px;height:52px;opacity:.75}
.face small{font-size:.8rem;color:var(--mut);text-align:center;line-height:1.2}
.face input:checked+span{border-color:var(--pri);background:var(--pri2)}
.face input:checked+span img{opacity:1}.face input:checked+span small{color:var(--tx);font-weight:700}
.face input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.face-rd{display:inline-flex;align-items:center;gap:8px}.face-rd img{width:40px;height:40px}
.auto{min-height:42px;padding:9px 11px;border:1px dashed var(--bd);border-radius:9px;background:#f4f7f6}


.anx{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.anx-it{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:9px;padding:6px 8px;background:#fff;max-width:100%}
.anx-it img,.anx-ic{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#eef2f1;flex:none}
.anx-ic{display:grid;place-items:center;font-weight:800;color:var(--err);font-size:.8rem}
.anx-it span{font-size:.8rem;word-break:break-all;max-width:180px}
.anx-add{position:relative;display:inline-block}
.anx-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.anx-img{border:0;padding:0;background:none;cursor:zoom-in}
.anx-img img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#eef2f1}
.anx-pdf{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem}
.rel-res{width:100%;border-collapse:collapse;font-size:.88rem}.rel-res th,.rel-res td{border:1px solid var(--bd);padding:6px 8px;text-align:left}.rel-res th{background:#f2f6f5}
.rel-it{border-top:2px solid var(--pri);padding:12px 0 6px;break-inside:avoid-page}
.rel-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rel-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:6px 0 12px}
.rel-img img{width:100%;max-height:300px;object-fit:contain;border:1px solid var(--bd);border-radius:6px;background:#fafafa;break-inside:avoid}
.rel-pdf{font-size:.88rem}
.print-only{display:none}
@media print{.print-only{display:inline}.rel-img{grid-template-columns:1fr 1fr}.rel-img img{max-height:260px}}


.pub{min-height:100vh;padding:20px 12px 60px;background:linear-gradient(160deg,#0b6e4f,#0e4d3d)}
.pub-card{max-width:720px;margin:0 auto;padding:22px}
.pub-card h1{margin:6px 0 4px}
.rel-tab{width:100%;border-collapse:collapse;font-size:.84rem}
.rel-tab th,.rel-tab td{border:1px solid var(--bd);padding:6px;vertical-align:top;text-align:left}
.rel-tab th{background:#dbe7f5}
@media print{.rel-quebra{break-before:page}.pub{background:#fff}}


/* Projeto de intervenção (layout do guia) */
.pi-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.pi-nav{position:sticky;top:112px;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}
.pi-prog .bar{margin-top:6px}
.pi-grp-t{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:2px}
.pi-nav a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--tx);padding:4px 6px;border-radius:7px;font-size:.86rem}
.pi-nav a:hover{background:var(--pri2)}
.pi-n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--mut);flex:none}
.pi-nav a.done .pi-n{background:var(--pri);border-color:var(--pri);color:#fff}
.pi-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.pi-intro{background:var(--pri2);border-radius:12px;padding:16px 18px;font-size:.92rem}
.pi-intro p{margin:0 0 8px}
.path{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.path span{font-size:.8rem;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.pi-step{padding:0;overflow:hidden;margin:0;scroll-margin-top:110px}
.pi-h{padding:16px 18px 4px}
.step-n{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pri);font-weight:800}
.pi-h h2{margin:4px 0 0;font-size:1.15rem}
details.guia{margin:8px 18px 14px;border-bottom:1px dashed var(--bd);padding-bottom:10px}
details.guia summary{cursor:pointer;font-weight:600;color:var(--pri-d);font-size:.88rem}
.guia-c{font-size:.9rem;margin-top:8px}
.guia-c p{margin:0 0 8px}
.guia-c h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.guia-c ul{margin:0 0 8px;padding-left:20px}.guia-c li{margin-bottom:3px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:6px 0 10px}
.mini div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:.85rem;background:#fff}
.mini b{display:block;margin-bottom:2px}
.tip,.warn{border-radius:8px;padding:9px 12px;font-size:.86rem;margin:8px 0 2px}
.tip{background:var(--pri2)}.tip b{color:var(--pri-d)}
.warn{background:var(--warn2)}.warn b{color:var(--warn)}
table.ref{border-collapse:collapse;width:100%;font-size:.85rem}
table.ref th,table.ref td{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
table.ref th{font-size:.72rem;text-transform:uppercase;color:var(--mut)}
.pi-fields{background:#f6f9f8;padding:14px 18px 6px;border-top:1px solid var(--bd)}
.fields-t{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);font-weight:800;margin-bottom:8px}
.count{font-size:.75rem;color:var(--mut);text-align:right}
.calc{font-size:.88rem;padding:9px 12px;border-radius:9px;background:#fff;border:1px solid var(--bd)}
.calc.bad{border-color:var(--warn)}.calc-al{color:var(--warn);margin-top:4px;font-size:.84rem}
ul.abnt{font-size:.84rem;color:var(--mut)}
@media (max-width:900px){
  .pi-wrap{grid-template-columns:1fr}
  .pi-nav{position:sticky;top:104px;z-index:10;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-radius:10px}
  .pi-prog,.pi-grp-t{display:none}.pi-grp{display:contents}
  .pi-nav a{flex:none;border:1px solid var(--bd)}.pi-lab{display:none}
}

/* Documento */
.doc-cab{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--pri);padding-bottom:10px;margin-bottom:8px}
.logo.lg{background:var(--pri);color:#fff;width:46px;height:46px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:#f7faf9;border-radius:10px;padding:10px 12px;margin:12px 0}
.meta-grid span{display:block;font-size:.75rem;color:var(--mut)}
.rd{margin-bottom:12px}.rd .lbl{color:var(--mut);font-size:.8rem;margin-bottom:2px}
.rd .val{white-space:pre-wrap}
.rd table{width:100%;border-collapse:collapse;font-size:.88rem}
.rd th,.rd td{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.rd th{background:#f2f6f5}
h3.sec{font-size:.95rem;color:var(--pri-d);border-bottom:1px solid var(--bd);padding-bottom:4px;margin:18px 0 10px}
.ass{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ass-i{border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;font-size:.85rem}
.ass-i.assinado{border-color:#a9d9b6;background:#f4fbf6}.ass-i.pendente{border-style:dashed;color:var(--mut)}
.ass-i em{margin-top:4px}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:.75rem;color:var(--mut)}
.score{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0b6e4f,#0e4d3d)}
.login .card{width:100%;max-width:380px;padding:26px}
.login .logo{width:54px;height:54px;background:var(--pri);color:#fff;margin-bottom:10px;font-size:1rem}

/* Modal, toast, carregamento */
.modal{position:fixed;inset:0;background:rgba(10,25,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px}
.modal-box h2{margin-top:0}
.m-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.erro-m{color:var(--err);font-size:.88rem;margin-top:6px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
.ts{background:#1f2d2a;color:#fff;border-radius:10px;padding:10px 16px;font-size:.9rem;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ts.err{background:var(--err)}.ts.ok{background:var(--ok)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,#7fe0b4,transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.notif{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.notif.nl{font-weight:600}.notif small{display:block;color:var(--mut);font-weight:400}
.ul{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.72rem;background:#eef1f0;border-radius:6px;padding:2px 7px;color:var(--mut)}

@media (max-width:600px){
  .row2{grid-template-columns:1fr}
  .pg-head{flex-direction:column}
  .brand small{max-width:52vw}
  .hbar{grid-template-columns:1fr 44px}.hbar .nm{grid-column:1/-1}
}
@media print{
  .no-print,.top,.tabs,.barra-acoes,#toast{display:none!important}
  body,html{background:#fff}main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .chip{border:1px solid #999}
}
/* Frequência e escalas (versão 2) */
.fq-tabs{max-width:560px}
.fq-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start}
.fq-reg{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:22px 16px}
.fq-relogio span{display:block;font-size:3rem;font-weight:800;line-height:1;color:var(--pri);font-variant-numeric:tabular-nums}
.fq-relogio small{color:var(--mut)}
.fq-loc{width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;background:#f8faf9}
.fq-loc b{display:block}.fq-loc small{display:block;color:var(--mut);font-size:.78rem}
.fq-loc.ok{background:var(--ok2);border-color:#b9dfc3}.fq-loc.ok b{color:var(--ok)}
.fq-loc.fora{background:var(--warn2);border-color:#f1d49b}.fq-loc.fora b{color:var(--warn)}
.fq-loc.erro{display:block;background:var(--err2);border-color:#f0c4c0}.fq-loc.erro b{color:var(--err)}
.fq-pulse{width:14px;height:14px;border-radius:50%;background:var(--pri);flex:none;animation:fqp 1.2s infinite}
@keyframes fqp{0%{box-shadow:0 0 0 0 rgba(11,110,79,.5)}100%{box-shadow:0 0 0 14px rgba(11,110,79,0)}}
@media (prefers-reduced-motion:reduce){.fq-pulse{animation:none}}
.fq-bater{width:100%;max-width:360px;border:0;border-radius:16px;padding:20px;font-size:1.2rem;font-weight:800;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 6px 18px rgba(11,110,79,.25)}
.fq-bater.saida{background:#24508f;box-shadow:0 6px 18px rgba(36,80,143,.25)}
.fq-bater:disabled{opacity:.6;cursor:default}
.fq-linha{list-style:none;padding:0;margin:8px 0}.fq-linha li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--bd)}
.fq-linha li small{flex-basis:100%;color:var(--mut);font-size:.78rem}
.fq-tp{display:inline-block;font-size:.68rem;font-weight:800;border-radius:5px;padding:1px 6px;color:#fff;background:var(--pri)}.fq-tp.saida{background:#24508f}
.fq-tab{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.fq-tab th,.fq-tab td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.fq-tab th{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.fq-tab tr.click{cursor:pointer}.fq-tab tr.click:hover{background:#f6f9f8}
.fq-tab .nw{white-space:nowrap}.fq-rg{margin-bottom:3px}.fq-rg small.d{display:block;margin-left:22px}
.fq-op{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:999px;padding:6px 11px;font-size:.85rem;cursor:pointer;background:#fff}
.fq-chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap;margin:1px 0}
.fq-chip.st-ok{background:var(--ok2);color:var(--ok)}.fq-chip.st-warn{background:var(--warn2);color:var(--warn)}.fq-chip.st-err{background:var(--err2);color:var(--err)}.fq-chip.st-info{background:var(--info2);color:var(--info)}
.esc-frame{display:block;width:100%;height:calc(100vh - 120px);min-height:520px;border:0;border-radius:12px;background:var(--bg)}
.lembrar{display:flex;gap:8px;align-items:center;font-size:.88rem;margin-top:10px;cursor:pointer}
@media (max-width:760px){.fq-grid{grid-template-columns:1fr}.fq-relogio span{font-size:2.6rem}}
</style>
</head>

<script>
/* ======================= CONFIGURAÇÃO DOS FORMULÁRIOS =======================

/* ---------- Matriz de Competências (Residência Multiprofissional SEMS/Fiocruz Dourados) ---------- */
const MATRIZ = (function(){
const CAMPO = [
 {d:"Comunicação clínica",
  comp:"Estabelecer uma comunicação efetiva e eficiente com usuários, famílias, equipe de trabalho, comunidade e outros interlocutores, com base na ética, respeito, valorização e empatia, visando à integralidade do cuidado.",
  C:["Conhecer as técnicas e estratégias para uma comunicação efetiva, incluindo a comunicação em situações difíceis e comunicação não violenta.","Reconhecer na comunicação multimodal estratégia importante para eficiente compartilhamento de informação.","Compreender a importância das tecnologias leves no cuidado em saúde.","Conhecer os níveis e tipos de comunicação."],
  H:["Realizar o diálogo efetivo com os usuários, equipe e comunidade, com base em uma comunicação não violenta.","Realizar escuta ativa e qualificada na abordagem ao usuário e comunidade.","Ajustar o tom de voz e velocidade da fala, modulando-a conforme a situação e necessidade do público.","Controlar expressões faciais e linguagem corporal ao comunicar-se com o seu interlocutor.","Utilizar estratégias de comunicação em situações difíceis, especialmente na transmissão de más notícias.","Identificar a comunicação não verbal e responder a ela adequadamente.","Identificar as possíveis barreiras na comunicação e aplicar adequadamente as estratégias para minimizá-las.","Coletar e comunicar informações relevantes para o raciocínio clínico e para tomada de decisão.","Adequar a informação à cultura e nível de compreensão do público-alvo por meio de uma linguagem didática compreensível.","Falar em público de forma clara e efetiva.","Reconhecer as subjetividades (dos usuários culturalmente diferentes) como elemento importante no processo de cuidado em saúde."],
  A:["Respeitar os valores individuais e coletivos, bem como os aspectos culturais do território.","Atuar de maneira empática, respeitosa e ética nas relações interpessoais.","Saber ouvir com empatia, respeito e valorização do interlocutor.","Saber fazer, receber e aceitar críticas de forma reflexiva."]},
 {d:"Gestão do cuidado e de processos",
  comp:"Realizar a gestão de pessoas, estratégias, organização, recursos físicos, materiais e de informação, de forma intersetorial, horizontal e participativa, destinados às ações de saúde e ao cuidado a indivíduos, famílias e coletividades, de forma humanizada e conforme os princípios e diretrizes da APS.",
  C:["Conhecer a rede de atenção à saúde.","Conhecer os recursos e carteiras de serviços do usuário na rede de atenção à saúde.","Reconhecer a diversidade de configurações familiares e as ferramentas de abordagem familiar.","Compreender os conceitos da clínica ampliada e as fases do Projeto Terapêutico Singular.","Conhecer as condutas terapêuticas articuladas para o indivíduo, família ou grupo de pessoas, com discussão coletiva pela equipe multidisciplinar, conjuntamente com apoio matricial.","Conhecer o arcabouço legal que fundamenta a clínica ampliada em saúde.","Conhecer o programa nacional de segurança do paciente."],
  H:["Realizar assistência integral (promoção e proteção da saúde, prevenção de agravos, diagnóstico, tratamento, reabilitação e manutenção da saúde) aos indivíduos e famílias na USF.","Fortalecer a rede de atenção à saúde, promovendo a articulação entre os diferentes setores visando otimizar o fluxo e a continuidade do cuidado ao usuário.","Organizar o serviço e o processo de trabalho, promovendo a horizontalidade entre as especialidades e otimizar os recursos de outros pontos de atenção da rede.","Acolher o usuário contemplando a demanda, por meio de escuta qualificada, observação atenta e integral, e de maneira resolutiva.","Reconhecer a rede de assistência à saúde e a função dos seus componentes para o desenvolvimento das ações em saúde na APS.","Identificar as necessidades de saúde, referidas ou percebidas, considerando os aspectos biológicos/funcionais, psicológicos/cognitivos, socioculturais e de constituição familiar, buscando uma abordagem integral.","Identificar as necessidades de cuidado do indivíduo, mapeando os familiares e sua atuação dentro dos estágios de enfrentamento da doença.","Utilizar a abordagem familiar e suas ferramentas, estratégias de comunicação verbal e não verbal, na realização do atendimento.","Mobilizar recursos dos serviços e das instituições de saúde para organização e desenvolvimento do plano de cuidado, que atenda às necessidades de saúde do usuário, compreendendo a especificidade do trabalho de cada membro da equipe.","Estruturar um projeto terapêutico singular junto às equipes da atenção primária à saúde, utilizando conceitos de clínica ampliada e matriciamento.","Realizar o acolhimento, atendendo a todas as pessoas que procuram o serviço, garantindo a acessibilidade universal por meio de reorganização do processo descentralizado de trabalho.","Utilizar ferramentas de gestão da informação para planejar e monitorar indicadores de saúde, avaliar o impacto das intervenções e promover a melhoria contínua dos serviços de saúde.","Coordenar reuniões de matriciamento para discutir casos e temas, pactuar ações, avaliar resultados e repactuar novas estratégias para a produção do cuidado.","Instituir ações para segurança do paciente com medidas para reduzir os riscos e diminuir os eventos adversos.","Participar do gerenciamento de insumos da unidade de saúde.","Realizar o gerenciamento dos relatórios por ciclos de vida e grupos prioritários dos usuários vinculados à unidade de saúde, por meio do prontuário eletrônico e-SUS e outras plataformas."],
  A:["Valorizar a vida, por meio de responsabilidade social, proatividade, resolutividade e envolvimento com o serviço.","Assegurar a qualidade da atenção prestada ao indivíduo, família e coletividade, com responsabilidade, ética e compromisso.","Conceber saúde como processo de responsabilidade compartilhada.","Tomar decisões de forma compartilhada com a equipe, avaliando a eficácia e custo-efetividade das medidas, ações e procedimentos de saúde a serem adotados.","Assegurar a integralidade da atenção, qualidade e humanização do atendimento.","Desenvolver seu processo de trabalho com princípios de Ética e de Bioética, com resolutividade tanto em nível individual como coletivo."]},
 {d:"Cuidado orientado à comunidade e território",
  comp:"Desenvolver ações de cuidado integral e comunitário, articulando conhecimentos teóricos e práticos para a identificação das necessidades de saúde da população, considerando os determinantes sociais, os aspectos culturais e a participação social, com vistas à promoção da resolutividade e da qualidade do cuidado, atuando em rede com outros setores.",
  C:["Conhecer o território, equipamentos sociais e as lideranças comunitárias.","Compreender o conceito de território e o processo de territorialização.","Compreender os conceitos de risco e vulnerabilidade nos territórios adscritos às equipes de atenção primária à saúde.","Conhecer os determinantes e condicionantes do processo saúde-doença.","Conhecer os instrumentos de abordagem comunitária (ecomapa, diagnóstico de demanda, Estimativa Rápida Participativa, técnicas de georreferenciamento).","Reconhecer a importância das ferramentas de análise situacional para o desenvolvimento das ações em saúde.","Reconhecer os recursos/ferramentas disponíveis no território.","Conhecer os indicadores de saúde preconizados nas políticas públicas nacionais e locais."],
  H:["Organizar grupos no território para estimular o autocuidado e autonomia da comunidade.","Identificar as demandas e necessidades de saúde do território, realizando diagnóstico local da situação de saúde, por meio de instrumentos de abordagem comunitária.","Construir planos de cuidado voltados para a integralidade da atenção destinados a indivíduos, grupos e comunidade, compartilhados com a equipe.","Desenvolver ações integradas com os membros da equipe, destinadas à população escolar (PSE).","Realizar atendimentos domiciliares para as famílias que necessitam desse tipo de atenção.","Construir (e atualizar) o mapa da área de abrangência.","Realizar parcerias com os equipamentos do território.","Identificar os fatores determinantes e condicionantes da saúde.","Monitorar fatores de risco sanitários, ambientais, epidemiológicos e sociais no território.","Utilizar os indicadores de saúde como ferramenta para identificar, monitorar e avaliar as ações de saúde do território.","Desenvolver ações setoriais e intersetoriais com foco no território e coletividade.","Orientar a comunidade sobre as ações de saúde desenvolvidas.","Criar espaços na unidade de saúde e/ou no território, para a participação da comunidade no controle social."],
  A:["Estabelecer vínculos com a comunidade.","Valorizar os aspectos culturais de indivíduos e comunidade vinculados ao território.","Mobilizar a comunidade para ser promotora de saúde e cidadania.","Estimular a autonomia e corresponsabilização de indivíduos e comunidade para o cuidado em saúde.","Buscar alternativas frente a situações adversas, com postura ativa e visando à resolutividade dos serviços de saúde.","Estimular a participação popular e o controle social para o exercício da cidadania, com vistas à efetivação de direitos e o cuidado em saúde."]},
 {d:"Educação na saúde",
  comp:"Desenvolver e participar de processos educativos, de forma permanente e interdisciplinar, para a promoção de espaços de aprendizagem que valorizem os processos de trabalho em saúde, possibilitando o compartilhamento de saberes e experiências entre os profissionais, com vistas à transformação das práticas profissionais e da realidade dos serviços de saúde.",
  C:["Conhecer o conceito e fundamentos da aprendizagem significativa.","Conhecer as publicações que regem a Residência Multiprofissional em Saúde da Família.","Conhecer a PNAB para realizar ações educativas adequadas e em conformidade com as necessidades da atenção primária à saúde.","Conhecer as políticas, programas e ações de educação na saúde implementados pelo Ministério da Saúde com foco na integração ensino-serviço.","Conhecer a Política Nacional de Educação Permanente em Saúde.","Conhecer o conceito, princípios, diretrizes e estratégias da Educação Permanente em Saúde (EPS).","Identificar as diferenças existentes entre educação permanente em saúde e educação continuada.","Identificar as diferenças entre educação em saúde e educação na saúde.","Conhecer o conceito e fundamentos das metodologias ativas de aprendizagem e sua importância para os processos educativos.","Conhecer os fluxos de trabalho de sua unidade de saúde, distrito de saúde e Secretaria de Saúde.","Conhecer o SUS, o trabalho e organização da APS e as redes de atenção à saúde, visando uma compreensão dos processos de trabalho em saúde desenvolvidos."],
  H:["Promover processos educativos que valorizem a aprendizagem significativa, que tenha sentido para os atores envolvidos.","Possibilitar a construção de estratégias contextualizadas que promovam o diálogo entre as políticas gerais e a singularidade dos lugares e das pessoas.","Promover experiências inovadoras na gestão do cuidado e dos serviços de saúde que busquem a integração ensino-serviço.","Utilizar metodologias ativas de aprendizagem nos processos educativos desenvolvidos pela equipe.","Promover e/ou participar de processos educativos que busquem a integração entre o ensino e o serviço de forma interdisciplinar e participativa e que busquem atender as necessidades da população.","Colocar na prática dos serviços de saúde os conhecimentos teóricos adquiridos.","Promover e/ou participar de processos educativos com foco na aprendizagem significativa que valorizem a aplicabilidade dos conhecimentos nos processos de trabalho em saúde.","Incentivar as diversas categorias profissionais em saúde a participarem de processos de educação continuada.","Atuar como facilitador de processos educativos na saúde, fundamentado nos princípios e diretrizes da educação permanente em saúde.","Buscar, de forma contínua, novos conhecimentos por meio de materiais com embasamento científico, em plataformas que ofereçam informações pertinentes e atualizadas sobre temas relacionados ao seu processo de trabalho."],
  A:["Ser aberto a mudanças e novas experiências, valorizando a integração entre teoria e prática nos processos educativos desenvolvidos no trabalho.","Valorizar o trabalho como locus privilegiado para o processo de aprendizagem em saúde, com fundamento nos princípios da EPS.","Estar disposto a aprender a aprender e ter responsabilidade e compromisso com sua educação, com a formação dos futuros profissionais e com os processos educativos dos profissionais da equipe.","Ser agente mobilizador de mudanças na implementação da PNAB no seu processo de trabalho, com vistas ao empoderamento da equipe, à transformação dos serviços e à melhoria das relações de trabalho no SUS."]},
 {d:"Prevenção e promoção da saúde",
  comp:"Planejar, executar e avaliar as ações multiprofissionais e interdisciplinares de promoção da saúde e prevenção de doenças e agravos no território, articulando saberes técnicos e populares, e estimulando vínculos intersetoriais para o desenvolvimento da participação popular e controle social.",
  C:["Conhecer os conceitos e técnicas de promoção e prevenção.","Identificar os níveis de prevenção, conforme os princípios da epidemiologia, para efetiva resposta social aos problemas de saúde.","Conhecer os determinantes sociais de saúde e os equipamentos sociais.","Conhecer os princípios e eixos estratégicos da Educação Popular em Saúde.","Conhecer o conceito, os fundamentos e as estratégias das metodologias ativas e participativas, na perspectiva da Educação Popular em Saúde."],
  H:["Identificar os equipamentos sociais do território adscrito.","Estabelecer e fortalecer vínculos entre a Unidade de Saúde e os equipamentos sociais.","Promover atividades educativas, individuais e coletivas, na perspectiva da Educação Popular em Saúde.","Aplicar metodologias ativas e participativas nas ações de educação em saúde.","Elaborar e executar projetos intersetoriais.","Promover ações que visem à mudança de hábitos e estilo de vida, estimulando o autocuidado apoiado e a corresponsabilização em saúde.","Sistematizar, consolidar e divulgar informações e evidências referentes à prevenção de doenças e agravos e à promoção de saúde.","Desenvolver estratégias de comunicação, informação, educação em saúde e mobilização social para as ações de prevenção de doenças e agravos e promoção da saúde.","Realizar atendimentos domiciliares para o planejamento de ações de promoção e prevenção a serem desenvolvidas pela equipe.","Estabelecer parcerias intersetoriais, especialmente nos setores de educação, agricultura, trabalho e esporte.","Capacitar lideranças e formadores de opinião para serem multiplicadores de práticas de promoção de saúde e prevenção de doenças e agravos."],
  A:["Atuar de forma ética e responsável durante as ações de promoção da saúde e prevenção de doenças e agravos.","Estimular a autonomia dos usuários e comunidades, com vistas a fortalecer os fatores promotores e protetores de saúde e o enfrentamento cotidiano dos agravos e doenças.","Promover a mobilização da comunidade para ações de promoção da saúde e prevenção de doenças e agravos à saúde.","Respeitar as diversidades de valores, princípios e cultura presentes em indivíduos e coletividades ao pensar e propor as práticas de saúde.","Demonstrar compreensão respeitosa, responsável, sensível e solidária, considerando a diversidade sociocultural.","Estimular a participação de associações, organizações e entidades no desenvolvimento de ações de promoção da saúde.","Incentivar o desenvolvimento de parcerias intersetoriais, especialmente nos setores de educação, agricultura, trabalho e esporte.","Valorizar o trabalho multiprofissional e interdisciplinar em saúde."]},
 {d:"Trabalho em equipe",
  comp:"Desempenhar suas funções na equipe multiprofissional da saúde da família, e com demais trabalhadores envolvidos no cuidado, de forma interdisciplinar, interativa, ética, participativa, responsável e com bom relacionamento interpessoal.",
  C:["Conhecer as atribuições dos diferentes profissionais que atuam na Estratégia Saúde da Família (ESF).","Conhecer as ferramentas e técnicas de uma comunicação efetiva.","Conhecer as ferramentas de gestão do cuidado na atenção primária à saúde.","Conhecer as técnicas de mediação de conflitos.","Conhecer o conceito, os tipos e importância das relações interpessoais para o trabalho coletivo.","Conhecer o conceito de integralidade e sua aplicabilidade na atuação em equipe.","Conhecer as diferentes formas de liderança e sua aplicação.","Compreender o conceito, os tipos de equipe e suas formas de atuação."],
  H:["Planejar pautas e conduzir a reunião de equipe, exercendo liderança democrática.","Planejar e articular as ações da equipe, compartilhando as funções com os demais membros.","Compartilhar atendimento, discutir os casos e articular ações de forma interdisciplinar com foco na integralidade da atenção e resolubilidade dos serviços.","Construir e executar Projeto Terapêutico Singular em equipe multidisciplinar, de forma interdisciplinar, participativa, integrada e horizontal.","Estabelecer comunicação efetiva que favoreça o trabalho em equipe.","Gerenciar os conflitos que surgirem na equipe, propor estratégias e ser resolutivo.","Propor e desenvolver trabalhos em grupo com os demais membros da equipe.","Avaliar o processo de trabalho da equipe de forma contínua e crítica."],
  A:["Ser proativo, responsável, participativo, comunicativo, cooperativo, cordial e solidário com todos os trabalhadores envolvidos no cuidado.","Atuar de forma respeitosa, empática e ética junto à equipe.","Atuar de forma integrada, comprometida, cooperativa, corresponsável e resolutiva com a equipe.","Valorizar o conhecimento dos membros da equipe.","Autoavaliar-se continuamente, de forma crítica e responsável.","Estar receptivo para trocas de experiências e socialização do conhecimento.","Dialogar com os membros da equipe e demais trabalhadores de forma flexível e tolerante, respeitando pontos de vista diferentes e divergentes.","Construir bom relacionamento com todos os trabalhadores da unidade de saúde.","Desenvolver continuamente a inteligência emocional para o controle das emoções.","Resolver situações de forma equilibrada e responsável.","Reconhecer a importância de se estabelecer boas relações interpessoais para o trabalho coletivo."]},
 {d:"Vigilância em saúde",
  comp:"Promover as ações de vigilância em saúde do território de responsabilidade sanitária das equipes, com vistas à análise da situação em saúde e à gestão do cuidado.",
  C:["Conhecer os conceitos de epidemiologia e vigilância em saúde.","Conhecer o modelo da vigilância em saúde, tecnologias e ferramentas de trabalho.","Conhecer os sistemas de vigilância em saúde do Ministério da Saúde, da Secretaria Estadual e Municipal de Saúde.","Conhecer os fluxos de notificação compulsória e sua importância para ações de vigilância epidemiológica.","Compreender os conceitos de risco e vulnerabilidade nos territórios adscritos às equipes de atenção primária à saúde.","Conhecer os indicadores de saúde preconizados nas políticas públicas vigentes e da gestão municipal.","Conhecer as diretrizes e estratégias para atuação em situações de surto e emergência em saúde pública.","Compreender as relações de interdependência entre as ações da Vigilância em Saúde e das ações da Atenção Primária à Saúde, com foco no território."],
  H:["Realizar a análise da situação de saúde para o planejamento das ações.","Realizar as atividades de notificação compulsória para que sejam adotadas medidas de intervenção pertinentes e em tempo oportuno.","Mapear os riscos sanitários e vulnerabilidades existentes no território.","Promover ações de integração entre APS e vigilância em saúde.","Identificar situações de vulnerabilidade que indiquem a necessidade de busca ativa e coordenação do cuidado.","Realizar a vigilância, prevenção e controle de agravos e das doenças transmissíveis e não transmissíveis.","Monitorar fatores de risco sanitários, ambientais e sociais no território.","Realizar a vigilância das mortalidades no escopo da saúde da família para a análise de situação de saúde, planejamento e avaliação das ações.","Realizar a detecção oportuna e a adoção de medidas adequadas para a resposta de saúde pública.","Realizar a vigilância das violências, com vistas à obtenção de informações sobre esses agravos para fundamentar ações de enfrentamento dos determinantes e condicionantes das causas externas.","Utilizar o planejamento estratégico situacional como ferramenta de gestão da equipe.","Desenvolver ações intersetoriais destinadas à vigilância em saúde do território de responsabilidade da equipe de saúde da família."],
  A:["Ser vigilante no território de atuação da equipe de saúde da família.","Interagir com os indivíduos e seu grupo social, as coletividades e a população.","Ter atuação pautada na saúde como direito e como bem público, propondo ações que minimizem as iniquidades e desigualdades sociais.","Ter um olhar sensível e empático para as situações de vulnerabilidade.","Ter uma postura proativa para atuação em situações de surto e emergência em saúde pública."]},
 {d:"Valores profissionais",
  comp:"Desenvolver a prática profissional de maneira ética e comprometida, promovendo a corresponsabilização no cuidado à saúde entre profissionais, indivíduos e comunidades, e garantindo cuidados efetivos, integrais e emancipatórios, respeitando os princípios de humanização, equidade e autonomia.",
  C:["Reconhecer a importância da ética e bioética para as ações de saúde desenvolvidas individualmente e pela equipe.","Conhecer o Código de Ética de sua categoria profissional.","Conhecer a Política Nacional de Humanização e sua importância para o desenvolvimento das ações de saúde da equipe.","Conhecer as atribuições dos profissionais da APS/ESF para o desenvolvimento das ações de saúde da equipe.","Identificar os aspectos socioculturais da comunidade para o desenvolvimento das ações de saúde da equipe."],
  H:["Abordar o usuário de forma humanizada e acolhedora, buscando a resolubilidade do cuidado em saúde.","Realizar escuta qualificada, estabelecendo vínculo com o usuário e sua família.","Estabelecer comunicação interpessoal assertiva com os membros da equipe, usuários, grupos e comunidade.","Trabalhar em equipes multiprofissionais de forma interdisciplinar, com foco na integralidade da atenção e resolubilidade das ações.","Construir boas relações interpessoais com os membros da equipe, usuários, grupos e comunidade."],
  A:["Reconhecer-se como agente de saúde e fonte de recursos para a comunidade.","Atuar de forma reflexiva e crítica em seu processo de trabalho, buscando autoavaliar-se continuamente.","Respeitar a liberdade e autonomia do usuário, incentivando a corresponsabilização pelos cuidados em saúde.","Ser ético, empático e respeitoso em suas relações com os membros da equipe, usuário, grupos e comunidade.","Ser solidário, cooperativo e tolerante em suas relações com o usuário, comunidade e a equipe de trabalho.","Adaptar-se a situações novas e a imprevistos, buscando alternativas frente às adversidades, com postura ativa.","Ser responsável e manter relações horizontais, flexíveis e cordiais com os membros da equipe, usuário, grupos e comunidade.","Ter uma postura profissional resiliente, humanista, comprometida, dinâmica, empreendedora e proativa.","Ter respeito para com os usuários e colegas de trabalho.","Exercer sua cidadania para assegurar direitos.","Ser um líder motivador, sem autoritarismo, atuando de forma flexível e tolerante, respeitando pontos de vista diferentes e divergentes.","Respeitar o conhecimento popular e sua diversidade, promovendo o diálogo e a integração com o saber técnico.","Atuar sem emissão de juízo de valores éticos, culturais e religiosos, estigmas e preconceitos.","Valorizar o saber e experiência de vida do usuário, respeitando seus valores, princípios e cultura."]}
];

 "Enfermagem":{

sulta de enfermagem.","Planejar, gerenciar, supervisionar e avaliar as ações desenvolvidas pelo técnico de enfermagem e pelo agente comunitário de saúde.","Elaborar, implementar e avaliar os fluxos assistenciais, protocolos e diretrizes em conjunto com a equipe e demais trabalhadores.","Implementar e avaliar ações educativas que atualizem a equipe de enfermagem e os ACS sobre fluxos, rotinas e protocolos de trabalho.","Realizar práticas de educação permanente de forma individual ou compartilhada com a equipe da unidade.","Gerenciar, de forma individual ou compartilhada, os insumos da unidade de saúde."],
  A:["Atuar com segurança no desenvolvimento de suas atividades profissionais.","Ser empático nas suas relações interpessoais.","Ter uma postura proativa no desenvolvimento de suas atividades, em especial em situações críticas de urgência e emergência.","Ser atencioso, acolhedor e resolutivo com os usuários da unidade.","Atuar de forma ética, respeitosa e responsável com todos os usuários e trabalhadores da unidade.","Ser persuasivo na defesa de suas opiniões e propostas apresentadas para a equipe.","Ter comunicação assertiva pautada em pensamento crítico e reflexivo.","Atuar no seu processo de trabalho de forma organizada e disciplinada.","Exercer liderança junto à equipe, valorizando o trabalho multiprofissional e interdisciplinar.","Ter capacidade de mediar os conflitos que surgem na equipe, com os demais trabalhadores e com os usuários da unidade.","Realizar a consulta de enfermagem de forma responsável e efetiva, fazendo gestão adequada do tempo.","Realizar escuta de forma qualificada.","Ter segurança na realização da coleta, avaliação e orientação dos exames.","Ser comprometido com o acompanhamento da saúde da população.","Ser efetivo na coordenação do cuidado.","Valorizar o trabalho em equipe, atuando de forma harmoniosa e respeitosa.","Buscar novos conhecimentos, mantendo-se atualizado e disposto a aprender continuamente."]},
 "Fisioterapia":{

  C:["Identificar a etiologia e patologia das doenças prevalentes em todos os ciclos de vida presentes na área de abrangência da unidade.","Identificar aspectos relacionados ao desenvolvimento neuropsicomotor normal.","Reconhecer as metodologias de avaliação das condições de vida dos usuários e seus familiares vinculados à unidade: indicadores epidemiológicos, demográficos e socioeconômicos.","Definir metodologias para elaboração de planos de ação e material educativo para utilização em todos os ciclos de vida.","Reconhecer metodologias para identificação de distúrbios do movimento e para seleção de prioridades em todos os ciclos de vida.","Identificar deficiências, síndromes e transtorno neuromotor.","Detectar disfunções do assoalho pélvico.","Compreender as afecções respiratórias prevalentes (asma, enfisema, DPOC e bronquite).","Identificar alterações neurológicas, traumato-ortopédicas, reumáticas, cardíacas e vasculares.","Reconhecer os problemas posturais mais prevalentes na área de abrangência.","Identificar doenças crônicas relacionadas à saúde do trabalhador e doenças osteoarticulares e osteomusculares.","Detectar fatores de risco doméstico que podem causar acidentes e quedas."],
  H:["Planejar grupos terapêuticos e preventivos de atenção à saúde.","Identificar os fatores de risco neuromotor de cada fase.","Utilizar critérios epidemiológicos no planejamento das ações.","Realizar avaliação e diagnóstico fisioterapêutico/funcional, estabelecendo objetivos e condutas para as patologias identificadas.","Desenvolver tratamento fisioterapêutico, inclusive em domicílio, de acordo com a patologia e quadro funcional do paciente.","Desenvolver ações/intervenções em reabilitação e em saúde, envolvendo a família no processo de tratamento de acordo com o contexto em que se insere.","Intervir com ações de reabilitação nos fatores que interferem no movimento humano, funcionalidade e independência.","Realizar atendimento individual e/ou coletivo nas afecções respiratórias prevalentes (asma e bronquite), com orientações visando à prevenção e diminuição das crises.","Realizar atividades educativas voltadas a exercícios respiratórios.","Orientar as famílias e a equipe acerca dos aspectos relacionados ao desenvolvimento neuropsicomotor normal.","Utilizar metodologias para avaliação das ações e resultados obtidos.","Estabelecer estratégias de atenção fisioterapêutica para as prioridades da ESF.","Realizar ações e atividades para pacientes com alterações neurológicas, traumato-ortopédicas, reumáticas, cardíacas e vasculares.","Desenvolver atividades educativas de prevenção aos acidentes domésticos.","Desenvolver atividades terapêuticas e educativas para os problemas posturais mais prevalentes na área de abrangência.","Realizar ações e orientações para hipertensos, diabéticos e obesos.","Realizar estratégias de atenção aos pacientes com dor crônica, doenças relacionadas à saúde do trabalhador e doenças osteoarticulares e osteomusculares.","Aplicar estratégias de detecção e atuação multidisciplinar nas disfunções temporomandibulares.","Desenvolver ações para pacientes com hanseníase.","Realizar ações de acompanhamento e de orientações às gestantes.","Desenvolver es   A:["Estar receptivo a escutar os usuários e construir em conjunto o processo de intervenção estabelecido pela equipe multidisciplinar.","Desenvolver a capacidade de autoaprendizagem, autoavaliação e autogestão.","Atuar em seu processo de trabalho de forma ética, responsável e resolutiva.","Estimular a autonomia e corresponsabilização de indivíduos e comunidade para o cuidado em saúde.","Valorizar o trabalho em equipe multiprofissional e interdisciplinar em saúde.","Atuar de forma ética, mantendo a confidencialidade das informações confiadas, na interação com os outros profissionais de saúde e o público em geral.","Desenvolver a capacidade de liderar e tomar decisões.","Comunicar-se de forma efetiva com os usuários, familiares, profissionais e trabalhadores da unidade de saúde."]},
 "Odontologia":{
  comp:"Desenvolver ações de prevenção, promoção, proteção e reabilitação da saúde, com ética e resolutividade, conforme as atribuições previstas em lei, de forma integrada e multidisciplinar, responsabilizando-se pela saúde bucal em todos os ciclos de vida, em articulação com as demais instâncias do SUS, realizando atividades de administração e gerenciamento com liderança, ética profissional, comunicação eficiente, capacidade de tomar decisões e compromisso com sua educação, com a dos demais membros da equipe e usuários da unidade.",
  C:["Conhecer as bases de dados epidemiológicos referentes à saúde bucal e os sistemas de vigilância disponíveis.","Conhecer as particularidades do território e sua população.","Reconhecer os princípios de planejamento em saúde bucal e as políticas e legislação vigentes.","Conhecer a rede de atenção à saúde vinculada ao serviço, com ênfase na saúde bucal, assim como a rede hierárquica que a compõe.","Compreender os processos e a utilização dos equipamentos.","Identificar o perfil epidemiológico, os equipamentos sociais e o território de abrangência.","Definir as estruturas da boca e suas principais lesões.","Compreender a importância do registro adequado nos sistemas de informação vigentes."],
  H:["Intervir nos principais problemas relacionados à saúde bucal da população assistida, priorizando as necessidades para cada ciclo de vida.","Desenvolver estratégias para obtenção de perfil epidemiológico de saúde bucal da população adscrita.","Utilizar em sua atuação profissional os conteúdos das tarefas, das regras e dos procedimentos.","Desempenhar trabalho multiprofissional, adaptando-se à necessidade da equipe.","Planejar atividades com vistas ao gerenciamento da saúde geral e bucal com os demais membros da equipe de Saúde da Família, de forma integrada e considerando os atributos da APS.","Utilizar as informações em saúde para a execução de suas funções de núcleo e de campo.","Desenvolver habilidades de coordenação da Equipe de Saúde Bucal, com orientações, capacitação e supervisão técnica do TSB e ASB.","Aplicar técnicas e protocolos atualizados, voltados ao serviço de saúde e, mais especificamente, à saúde bucal.","Gerenciar, de forma individual ou compartilhada, os insumos necessários para o adequado funcionamento da UBS.","Articular com a comunidade o desenvolvimento de ações intersetoriais.","Executar procedimentos odontológicos com qualidade, aplicando técnicas conforme os preceitos científicos e apoiados em evidências.","Abordar o indivíduo como um todo, dentro das condições socioeconômicas em que está inserido, avaliando a presença de situações de risco à saúde.","Utilizar o levantamento epidemiológico e protocolo de atendimento, evitando perdas e retrabalhos e favorecendo o vínculo profissional/usuário.","Atender adequadamente os grupos específicos (hipertensos, diabéticos, gestantes, bebês, entre outros).","Executar os procedimentos clínicos com precisão e habilidade manual.","Realizar atendimento domiciliar qualificado.","Encaminhar os usuários a outros níveis de assistência, mantendo a responsabilização pelo acompanhamento e seguimento do tratamento.","Orientar os usuários a acessar outros níveis de assistência quando necessário.","Elaborar estratégias para o enfrentamento dos problemas de saúde identificados, com base em evidências e respeito às atribuições da APS.","Implantar estratégias para o enfrentamento dos problemas de saúde identificados, com base em evidências e respeito às atribuições da APS."],
  A:["Ter postura e visão preventiva, promovendo a utilização de novas práticas sanitárias e intervenções de menor complexidade.","Promover orientações que incentivem o autocuidado e a prevenção das doenças bucais.","Articular com a comunidade e equipamentos sociais para o desenvolvimento das ações, em especial da saúde bucal.","Respeitar princípios da ética/bioética vigentes, incluindo o código de ética profissional nas ações, condutas e relações de trabalho.","Desempenhar seu processo de trabalho de forma responsável, comprometendo-se com a qualidade e resolutividade dos serviços.","Desempenhar suas funções com segurança, liderança, confiança, criatividade, iniciativa e flexibilidade.","Proporcionar condições para que haja benefício mútuo entre os futuros profissionais e os profissionais dos serviços.","Ter responsabilidade social com a comunidade onde exerce suas atribuições profissionais.","Acolher os pacientes, ouvindo-os de forma respeitosa, buscando resolver seus problemas de saúde.","Acolher, escutar, examinar e tentar resolver os problemas junto com o paciente."]},
 "Psicologia":{
  comp:"Desenvolver o cuidado integral à saúde dos usuários, a partir do planejamento e da execução de ações de prevenção, promoção, proteção e reabilitação da saúde, em nível individual e coletivo, conforme as atribuições previstas em lei, responsabilizando-se especialmente pela saúde mental em todos os ciclos de vida, articulado com as necessidades do território e com as demais instâncias do SUS, com liderança, ética profissional, comunicação eficiente, capacidade de tomar decisões e compromisso com seu processo formativo.",
  C:["Compreender os princípios norteadores das políticas de educação em saúde pública, bem como de saúde mental.","Compreender criticamente os fenômenos sociais, econômicos, culturais, políticos e históricos do Brasil, em consonância com a realidade latino-americana.","Reconhecer e compreender os aspectos multifatoriais na condição humana e nos fenômenos psicológicos em todos os ciclos de vida, articulando filosofia, antropologia e sociologia.","Interpretar os fenômenos psicológicos nas interfaces com os fenômenos biológicos e socioculturais em todos os ciclos de vida.","Reconhecer o Código de Ética Profissional do Psicólogo e a sua aplicabilidade.","Conhecer o perfil epidemiológico, as particularidades do território e o perfil sociodemográfico de sua população.","Identificar as redes existentes de atenção à saúde, em especial a Rede de Atenção Psicossocial (RAPS).","Aprimorar conhecimentos teórico-metodológicos e práticos sobre técnicas psicoterapêuticas e de grupos no contexto público de saúde, no modelo da clínica ampliada.","Desenvolver conhecimento teórico sobre a atuação da psicologia na saúde pública (interconsulta, PTS, matriciamento, atendimento domiciliar, PICS, atendimentos em grupo e individuais).","Reconhecer as Práticas Integrativas e Complementares (PICS) enquanto recursos terapêuticos complementares nos atendimentos em saúde."],
  H:["Realizar intervenções psicossociais e psicológicas individuais, familiares e coletivas, em todos os ciclos de vida.","Utilizar instrumentos e ferramentas, teóricos e práticos, no trabalho psicológico, bem como o conhecimento existente relacionado ao exercício da profissão.","Realizar, sempre que necessário e solicitado, relatório de atendimento/acompanhamento psicológico e laudos.","Fornecer informações relevantes, claras e precisas sobre assuntos relacionados à psicologia, conforme as necessidades dos usuários e da comunidade.","Elaborar relatórios e evolução dos casos em prontuário, prezando pela qualidade dos registros.","Promover especial atenção aos usuários e familiares em situação de risco psicossocial e/ou doença mental, com vistas à garantia da cidadania plena e livre circulação no território e na rede.","Realizar ações de saúde, individuais e/ou compartilhadas, considerando os diferentes contextos de vida, as necessidades sociais e os direitos humanos.","Promover, com as equipes, ações de enfrentamento de agravos vinculados ao uso abusivo de álcool, tabaco e outras drogas, redução de danos e combate à discriminação e à violência.","Desenvolver, de forma individual ou compartilhada, ações educativas de promoção da saúde e prevenção de doenças, em especial no campo da saúde mental.","Construir agendas compartilhadas, periodicamente, com as equipes de saúde, de forma participativa e responsiva.","Criar, com as equipes, os critérios necessários para acionar o Apoio Matricial, qualificando as práticas de acolhimento.","Problematizar com as equipes de saúde os processos de trabalho mais eficazes para o cuidado integral, horizontal, democrático e continuado.","Realizar, de forma compartilhada com as equipes, a construção de PTS para os casos de maior complexidade.","Propor diálogos e ações de enfrentamento coletivo de questões como violência, desemprego, pobreza, gênero, identidade, sexualidade, preconceitos e religiosidade.","Propor ações que promovam o Apoio Matricial da psicologia nos diferentes níveis de atenção à saúde, especialmente aos usuários de saúde mental.","Propor a criação de grupos na APS que fortaleçam os vínculos afetivos e comunitários como apoio aos usuários em situação de vulnerabilidade.","Participar das visitas domiciliares em que a singularidade do caso demande a escuta da subjetividade do sujeito, de sua família ou comunidade.","Realizar projetos com a população que incentivem parcerias com a comunidade.","Promover espaços de divulgação do fazer da(o) psicóloga(o) nos diversos âmbitos do SUS.","Atuar de forma interdisciplinar para a resolução colaborativa de problemas.","Avaliar constantemente os resultados do seu trabalho, com a participação dos envolvidos, propondo novas estratégias.","Realizar atividades de educação permanente que contribuam com a melhoria dos processos de trabalho da unidade de saúde.","Realizar atividades de educação em saúde com a população do território para a promoção de saúde, prevenção de doenças e autocuidado."],
  A:["Desenvolver as práticas profissionais da psicologia mais adequadas conforme a demanda apresentada.","Reconhecer que o fazer profissional da psicologia deve ser permanentemente relacionado aos condicionantes sociais, culturais, econômicos e comunitários.","Buscar, com as equipes, modos eficazes de compartilhamento de informações (prontuário, discussões de caso, PTS) sem extrapolar os limites do sigilo.","Ser proativo(a), atencioso(a), acolhedor(a) e resolutivo(a) com os usuários da unidade.","Respeitar a atuação das diferentes categorias, valorizando o trabalho em equipe multiprofissional e interdisciplinar na unidade e na rede intersetorial."]},

  comp:"Realizar ações de promoção da alimentação adequada e saudável nos ciclos da vida, englobando o processo de saúde e de adoecimento; utilizar ferramentas de abordagem nutricional adequadas a cada fase da vida e ao grau de instrução do usuário; desenvolver liderança frente aos programas de nutrição, realizar ações interprofissionais e discussões de casos.",
  C:["Realizar intervenções em alimentação e nutrição na APS e prestar atendimento nutricional em ambulatório ou em domicílio, conforme as recomendações.","Fornecer orientação sobre alimentação saudável em todas as fases do curso da vida.","Identificar as demandas e prioridades na atenção nutricional, considerando todas as etapas da assistência e a possibilidade de incorporação das PICS.","Atuar diretamente junto a indivíduos, famílias e comunidade, fornecendo orientação e apoio para a adequação da situação alimentar.","Reforçar a ação comunitária, estimulando a participação popular em todas as etapas das ações de Promoção da Alimentação Adequada e Saudável (PAAS).","Fortalecer as estratégias locais de Segurança Alimentar e Nutricional (SAN), focalizando famílias e indivíduos em situação de vulnerabilidade.","Atuar na reorientação dos serviços na perspectiva da promoção da saúde, com foco na PAAS e na Educação Alimentar e Nutricional (EAN).","Estimular a criação de ambientes favoráveis à saúde e apoiar a adoção de modos de vida e comportamento alimentar saudáveis.","Realizar ações educativas para a prevenção das doenças relacionadas à alimentação e nutrição.","Conhecer a rede de cuidado nutricional do SUS e organizar o cuidado nutricional (protocolos, fluxos, referência e contrarreferência).","Acompanhar as ações e estratégias de SAN, incluindo a organização da rede de apoio comunitário.","Realizar apoio matricial das equipes de atenção básica conforme legislação vigente.","Elaborar e implementar planos de cuidado nutricional integrados à equipe multiprofissional.","Promover práticas alimentares adequadas e sustentáveis, respeitando a cultura alimentar local."],
  H:["Realizar o diagnóstico nutricional, avaliação e monitoramento do estado nutricional com base em dados dietéticos, clínicos, bioquímicos e antropométricos, de acordo com a fase da vida.","Identificar o perfil epidemiológico da população atendida quanto a doenças e deficiências associadas à nutrição e DANT.","Desenvolver, implantar e implementar protocolos de atendimento nutricional adequados às características da população assistida.","Realizar atendimento nutricional individual, em domicílio ou em grupo/coletivo.","Elaborar a prescrição dietética com base no diagnóstico de nutrição, adequando-a à evolução do estado nutricional.","Registrar a prescrição dietética e a evolução nutricional do usuário em prontuário eletrônico.","Definir os procedimentos complementares na assistência nutricional ao indivíduo, em interação com a equipe multiprofissional.","Realizar ações educativas para a prevenção das doenças relacionadas à alimentação e nutrição.","Compilar e analisar os dados de vigilância alimentar e nutricional dos usuários, de forma integrada com a equipe multiprofissional.","Elaborar relatórios técnicos de não conformidades (equipamentos, local de atendimento, riscos à saúde) com as respectivas ações corretivas.","Atuar na equipe multiprofissional nas ações de promoção da alimentação adequada e saudável, utilizando ferramentas de abordagem familiar e comunitária.","Apoiar os usuários em escolhas alimentares e formas de produção de alimentos que preservem a alimentação regional, com base na soberania alimentar.","Elaborar materiais educativos e organizar oficinas culinárias para estimular hábitos saudáveis.","Realizar a Vigilância Alimentar e Nutricional (VAN) no território, utilizando sistemas como o SISVAN.","Identificar e monitorar agravos relacionados à nutrição, como desnutrição, obesidade, diabetes e hipertensão.","Participar de ações integradas de combate à insegurança alimentar e nutricional."],
  A:["Fazer uso de linguagem clara e acessível ao paciente, explicando o processo de atendimento nutricional e as condutas.","Integrar o conhecimento do paciente ao conhecimento científico de forma ética.","Evitar situações e questionamentos que possam causar constrangimento ao usuário.","Promover alimentação adequada, saudável e viável, respeitando hábitos, costumes, valores, práticas religiosas, aversões, alergias, situação social e poder aquisitivo do usuário.","Apoiar hábitos alimentares saudáveis no território (hortas comunitárias e domésticas, aquisição de alimentos in natura), desestimulando o consumo de ultraprocessados."]}

    {grupo:"Etapa 2 · Entender", titulo:"Introdução e contextualização", guia:"<p>Situa o leitor e apresenta o cenário da intervenção.</p>\n<h4>O que é esperado</h4>\n<ul>\n<li><b>Análise da situação atual:</b> descreva o local da intervenção (a UBS, a área das equipes, o bairro) e caracterize a população afetada.</li>\n<li><b>Justificativa:</b> por que a intervenção é necessária e quais impactos negativos ocorrem se o problema não for resolvido.</li>\n</ul>\n<h4>Perguntas orientadoras</h4>\n<ul>\n<li>Onde e com quem o problema acontece?</li>\n<li>Quantas pessoas são atingidas e quais são suas características?</li>\n<li>O que acontece se nada for feito?</li>\n</ul>", campos:[
      {id:'contexto', label:'Introdução: análise da situação atual', tipo:'textarea', linhas:9, contar:true, ph:'Descreva a unidade, o território, as equipes envolvidas e a população afetada. Separe os parágrafos com uma linha.'},

    {grupo:"Etapa 3 · Entender", titulo:"Diagnóstico situacional", guia:"<p>Antes de agir, é preciso demonstrar qual é o problema real.</p>\n<h4>O que é esperado</h4>\n<ul>\n<li><b>Problema central:</b> definição clara e específica do que será enfrentado. Ex.: “Baixa adesão à vacinação infantil na área da ESF X”.</li>\n<li><b>Coleta de dados:</b> como o problema foi identificado, combinando as fontes abaixo.</li>\n</ul>\n<div class=\"mini\">\n<div><b>Dados epidemiológicos</b>Indicadores oficiais e séries históricas do território.</div>\n<div><b>Questionários</b>Instrumentos aplicados à população ou à equipe.</div>\n<div><b>Observação direta</b>Vivência da rotina do serviço pela equipe.</div>\n<div><b>Prontuários</b>Registros clínicos e histórico de atendimentos.</div>\n</div>\n<div class=\"warn\"><b>Atenção.</b> O problema central deve ser comprovado por dados, não apenas por percepção. Registre a linha de base: ela será comparada ao resultado final.</div>", campos:[
      {id:'problema', label:'Problema central', tipo:'textarea', linhas:3, contar:true, ajuda:'Uma ou duas frases, específicas.', ph:'Ex.: Baixa cobertura de exame citopatológico em mulheres de 25 a 64 anos das ESF 59, 60 e 61.'},

    {grupo:"Etapa 4 · Decidir", titulo:"Objetivos", guia:"<h4>O que é esperado</h4>\n<ul>\n<li><b>Objetivo geral:</b> o impacto principal pretendido a longo prazo. Deve ser único, amplo e alinhado ao problema central.</li>\n<li><b>Objetivos específicos:</b> pequenas metas que, somadas, levam ao objetivo geral. Cada um deve passar pelos quatro critérios:</li>\n</ul>\n<div class=\"mini\">\n<div><b>Realista</b>A equipe consegue cumpri-lo com os recursos disponíveis?</div>\n<div><b>Mensurável</b>Existe um número ou indicador para medi-lo?</div>\n<div><b>Com prazo</b>Sabemos até quando deve ser alcançado?</div>\n<div><b>Verificável</b>Há uma fonte de dados para comprovar o resultado?</div>\n</div>\n<div class=\"tip\"><b>Dica de redação.</b> Inicie cada objetivo com um verbo no infinitivo: ampliar, reduzir, implantar, capacitar.</div>", campos:[
      {id:'obj_geral', label:'Objetivo geral', tipo:'textarea', linhas:3, ph:'Ex.: Ampliar a cobertura de exame citopatológico nas mulheres de 25 a 64 anos adscritas à UBS.'},
      {id:'obj_esp', label:'Objetivos específicos', tipo:'textarea', linhas:6, ajuda:'Um objetivo por linha. No PDF eles viram alíneas (a, b, c…).', ph:'Identificar, por lista nominal, as mulheres com exame em atraso até dezembro de 2026\nRealizar busca ativa de 80% das mulheres identificadas até março de 2027'}
]},
    {grupo:"Etapa 5 · Decidir", titulo:"Fundamentação teórica", guia:"<p>Revisão de literatura: o que a ciência diz sobre o assunto e quais são as boas práticas recomendadas para esse tipo de problema.</p>\n<div class=\"mini\">\n<div><b>Ministério da Saúde</b>Protocolos clínicos, diretrizes terapêuticas e Cadernos de Atenção Básica.</div>\n<div><b>OMS</b>Diretrizes internacionais e recomendações baseadas em evidência.</div>\n<div><b>Artigos recentes</b>Estudos, revisões sistemáticas e publicações indexadas.</div>\n</div>\n<div class=\"tip\"><b>Dica.</b> Prefira as versões mais recentes das diretrizes e cite apenas o que foi consultado. Use o sistema autor-data, por exemplo (BRASIL, 2017) ou Mendes (2012). Toda obra citada aqui deve aparecer nas referências (etapa 10).</div>", campos:[
      {id:'fundamentacao', label:'Fundamentação teórica', tipo:'textarea', linhas:14, contar:true, ph:'Apresente os conceitos, as diretrizes e as evidências que sustentam a intervenção, com as citações no texto.'}

    {grupo:"Etapa 6 · Planejar", titulo:"Metodologia: plano de ação (5W2H)", guia:"<p>A parte mais importante do projeto: o “como fazer”. O 5W2H transforma cada ação em uma linha do plano, com responsável, prazo e recurso.</p>\n<div class=\"tablewrap\"><table class=\"ref\">\n<thead><tr><th>Elemento</th><th>Tradução</th><th>O que define</th></tr></thead>\n<tbody>\n<tr><td>What</td><td>O quê</td><td>Qual ação será realizada</td></tr>\n<tr><td>Why</td><td>Por quê</td><td>Justificativa da ação</td></tr>\n<tr><td>Where</td><td>Onde</td><td>Local de execução</td></tr>\n<tr><td>When</td><td>Quando</td><td>Prazo / cronograma</td></tr>\n<tr><td>Who</td><td>Quem</td><td>Responsável pela ação</td></tr>\n<tr><td>How</td><td>Como</td><td>Método de execução</td></tr>\n<tr><td>How much</td><td>Quanto custa</td><td>Recurso necessário</td></tr>\n</tbody>\n</table></div>\n<div class=\"tip\"><b>Dica.</b> Detalhe o “como” com fluxograma, procedimento operacional padrão (POP) e planilhas de apoio, para que qualquer profissional da equipe consiga executar a ação.</div>", campos:[
      {id:'metodologia', label:'Descrição metodológica', tipo:'textarea', linhas:7, contar:true, ajuda:'Tipo de intervenção, cenário, participantes, etapas e estratégias. Pode ser curta.', ph:'Trata-se de um projeto de intervenção desenvolvido na UBS…'},
      {id:'acoes', label:'Plano de ação 5W2H', tipo:'cartoes', nome:'Ação', ajuda:'Cada cartão é uma linha do Quadro 1 no PDF.', campos:[['oque','O quê (ação)','ta','Ex.: Realizar busca ativa das mulheres em atraso'],['porque','Por quê','ta','Ex.: Baixa adesão ao rastreamento'],['onde','Onde','ta','Ex.: Território das ESF 59, 60 e 61'],['quando','Quando','in','Ex.: Até 30/11/2026'],['quem','Quem','in','Ex.: ACS e residentes de enfermagem'],['como','Como','ta','Ex.: Visita domiciliar com lista nominal extraída do PEC'],['quanto','Quanto','in','Ex.: Sem custo adicional']]}
]},
    {grupo:"Etapa 7 · Planejar", titulo:"Cronograma", guia:"<p>A forma mais segura de calcular o tempo é somar as três macrofases.</p>\n<div class=\"mini\">\n<div><b>1. Planejamento e organização · 1 a 2 meses</b>Desenho do projeto, reuniões com a equipe, extração de dados do prontuário e calibração das ferramentas.</div>\n<div><b>2. Execução e ciclos · 3 a 6 meses</b>As ações acontecem na prática: oficinas, visitas domiciliares, auditorias, atendimentos.</div>\n<div><b>3. Avaliação e consolidação · 1 mês</b>Indicadores finais, comparação antes e depois e relatório de impacto.</div>\n</div>\n<div class=\"tip\"><b>Regra de ouro: 6 a 12 meses.</b> É a duração sustentável para projetos locais em UBS. Prazos mais longos correm risco de descontinuidade por mudanças políticas ou institucionais.</div>\n<div class=\"warn\"><b>Reserve 20% a 30% de margem</b> para os gargalos da APS: surtos (como dengue), rotatividade de profissionais, férias e feriados, tempo de resposta da gestão. Projetos sobre arboviroses devem cobrir todo o período de maior incidência (4 a 5 meses).</div>", campos:[
      {id:'crono_inicio', label:'Mês de início', tipo:'month', ajuda:'Usado para nomear as colunas do quadro.'},
      {id:'fases', label:'Atividades', tipo:'cartoes', nome:'Atividade', ajuda:'Informe o mês de início e de fim de cada atividade (mês 1 = mês de início do projeto).', campos:[['atividade','Atividade','ta','Ex.: Oficinas com as equipes'],['fase','Fase','sel',[['1','1 · Planejamento'],['2','2 · Execução'],['3','3 · Avaliação']]],['ini','Mês de início','num',''],['fim','Mês de fim','num','']]},

    {grupo:"Etapa 8 · Planejar", titulo:"Recursos e orçamento", guia:"<p>O que será necessário para tirar o projeto do papel. Em projetos locais, o principal recurso costuma ser o <b>tempo protegido da equipe</b>: registre as horas previstas para cada atividade.</p>\n<div class=\"mini\">\n<div><b>Recursos humanos</b>Profissionais envolvidos: médicos, enfermeiros, ACS, residentes, coordenação.</div>\n<div><b>Recursos materiais</b>Equipamentos, panfletos, insumos, computadores, materiais de apoio.</div>\n<div><b>Financeiro</b>Quando houver custo: valores previstos por item e fonte de financiamento.</div>\n</div>", campos:[
      {id:'rec_humanos', label:'Recursos humanos', tipo:'textarea', linhas:4, ph:'Ex.: 3 ACS (4 h/semana cada), 1 enfermeira preceptora (2 h/semana), 2 residentes de enfermagem…'},
